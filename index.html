function googleIcon(){return `<svg class="google-logo" aria-hidden="true" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.28 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.93 46.98 24.55Z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.6.27-3.14.76-4.59l-7.98-6.2C.92 16.46 0 20.13 0 24s.92 7.54 2.56 10.78l7.97-6.19Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.87-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.14 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>`;}
function photoUrl(){const url=String(ui.user?.photoURL||'');try{const u=new URL(url);return u.protocol==='https:'?sx(url):'';}catch{return '';}}
function currentName(){return String(ui.profile?.name||ui.user?.displayName||ui.user?.email?.split('@')[0]||'Atleta').trim();}
function accountAvatar(){const n=ui.user?currentName():'';const src=photoUrl();return `<span class="account-avatar">${ui.user?sx(initials(n)):`${i('users')}`}${src?`<img src="${src}" alt="" referrerpolicy="no-referrer" />`:''}</span>`;}
function accountButton(place){const signed=!!ui.user;const name=signed?currentName():'Entrar no Pulso';const sub=signed?(ui.user.email||'Conta conectada'):'Login ou cadastro';return `<button class="account-trigger" type="button" data-account="toggle" data-place="${place}" aria-label="${signed?'Abrir menu da conta de '+sx(name):'Entrar ou criar conta'}" aria-haspopup="menu" aria-expanded="${ui.accountOpen&&ui.accountPlace===place?'true':'false'}">${accountAvatar()}<span class="account-info"><strong>${sx(name)}</strong><small>${sx(sub)}</small></span><svg class="icon icon-sm account-chevron" aria-hidden="true"><use href="#i-chevronright"></use></svg></button>`;}
function accountMenuHtml(){return `<div class="account-menu-head">${accountAvatar()}<div class="account-info"><strong>${sx(ui.user?currentName():'Bem-vindo ao Pulso')}</strong><small>${sx(ui.user?.email||'Sua conta em um toque')}</small></div></div>${ui.user?`
  <button type="button" data-account="profile">${i('users')} Meu perfil</button>
  <button type="button" data-account="community">${i('pulse')} Ver comunidade</button>
  <button type="button" data-account="switch">${i('edit')} Trocar de conta</button>
  <button type="button" class="account-danger" data-account="logout">${i('x')} Sair da conta</button>
  <div class="account-menu-foot">Treinos pessoais privados. Você escolhe o que compartilhar.</div>`:`
  <button type="button" data-account="google">${googleIcon()} Continuar com Google</button>
  <button type="button" data-account="email">${i('users')} Entrar com e-mail</button>
  <button type="button" data-account="register">${i('plus')} Criar uma conta</button>
  <div class="account-menu-foot">Sua rotina continua disponível mesmo sem login.</div>`}`;}
function accountMenuRoot(){let r=document.getElementById('pulso-account-menu');if(!r){r=document.createElement('div');r.id='pulso-account-menu';r.className='account-menu';r.setAttribute('role','menu');r.hidden=true;document.body.appendChild(r);}return r;}
function closeAccountMenu(){ui.accountOpen=false;const r=document.getElementById('pulso-account-menu');if(r)r.hidden=true;document.querySelectorAll('[data-account="toggle"]').forEach(b=>b.setAttribute('aria-expanded','false'));}
function renderAccountUi(){for(const place of ['header','sidebar']){const slot=document.getElementById(`pulso-${place}-account`);if(slot)slot.innerHTML=accountButton(place);}
 const menu=ui.accountOpen?accountMenuRoot():document.getElementById('pulso-account-menu');if(ui.accountOpen && menu){menu.innerHTML=accountMenuHtml();placeAccountMenu();}}
function placeAccountMenu(){const menu=accountMenuRoot();const anchor=document.querySelector(`[data-account="toggle"][data-place="${ui.accountPlace}"]`);if(!anchor)return;
 menu.hidden=false;menu.style.visibility='hidden';const rect=anchor.getBoundingClientRect();const width=menu.offsetWidth,height=menu.offsetHeight;
 const left=ui.accountPlace==='sidebar'?rect.right+12:rect.right-width;
 menu.style.left=Math.min(Math.max(12,left),innerWidth-width-12)+'px';
 menu.style.top=Math.max(12,Math.min(rect.bottom+10,innerHeight-height-12))+'px';menu.style.visibility='visible';}
async function doGoogleLogin(){closeAccountMenu();if(!configured||!fire||!auth){showToast('O login ainda está carregando. Tente novamente.');return;}
 if(ui.busy)return;ui.busy=true;try{const provider=new fire.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
 await fire.signInWithPopup(auth,provider);showToast('Conta Google conectada com sucesso.');
 }catch(e){notifyError(e);}finally{ui.busy=false;mount();}}
async function accountClick(button){const action=button.dataset.account;
 if(action==='toggle'){if(ui.accountOpen&&ui.accountPlace===button.dataset.place){closeAccountMenu();return;}ui.accountOpen=true;ui.accountPlace=button.dataset.place;renderAccountUi();return;}
 closeAccountMenu();
 if(action==='google'){doGoogleLogin();return;}
 if(action==='email'||action==='register'){ui.authMode=action==='register'?'register':'login';window.PulsoLocal?.navigate?.('social');mount();return;}
 if(action==='community'||action==='profile'){ui.page=action==='profile'?'profile':'feed';ui.group=null;window.PulsoLocal?.navigate?.('social');mount();return;}
 if(action==='switch'||action==='logout'){
  if(action==='logout'&&!confirm('Sair da sua conta do Pulso? Os treinos deste login continuam salvos.'))return;
  if(!auth||!fire)return;
  if(ui.ready)await syncLocal(true);
  await fire.signOut(auth);
  if(action==='switch'){ui.authMode='login';window.PulsoLocal?.navigate?.('social');}
  showToast('Você saiu da conta.');
 }
}

  <div class="social-tabs"><button data-social="auth-view" data-mode="login" class="${ui.authMode==='login'?'active':''}">Entrar</button><button data-social="auth-view" data-mode="register" class="${ui.authMode==='register'?'active':''}">Criar conta</button></div>
  <button class="google-login" type="button" data-social="google" ${ui.busy?'disabled':''}>${googleIcon()} Continuar com Google</button>
  <div class="auth-divider">ou entre com e-mail</div>
  <form class="social-form" id="social-auth-form">

   <div><label>E-mail</label><input name="email" type="email" required autocomplete="email" placeholder="voce@exemplo.com" /></div>
   <div><label>Senha</label><input name="password" type="password" required minlength="6" autocomplete="${ui.authMode==='register'?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres" /></div>
   <button class="btn primary" type="submit" ${ui.busy?'disabled':''}>${ui.busy?'Processando...':ui.authMode==='login'?'Entrar na minha conta':'Criar conta gratuita'}</button>
  </form>
  ${ui.authMode==='login'?`<button class="subtle-link" data-social="forgot" style="margin-top:11px">Esqueci minha senha</button>`:''}
  <p class="social-footnote">Seus treinos ficam privados. Só aparecem para outras pessoas depois de você escolher <strong>Compartilhar</strong>.</p>

function i(name){return `<svg class="icon icon-sm" aria-hidden="true"><use href="#i-${name}"></use></svg>`;}
function topHtml(){
 return `<div class="social-hero"><div><div class="eyebrow">COMUNIDADE PULSO</div><h1 class="page-title">Treine junto.</h1><p class="page-subtitle">Sua rotina é sua. Compartilhe só o que quiser.</p></div><button class="btn primary" data-social="share-open">${i('plus')} Compartilhar treino</button></div>
 <div class="social-tabs">${[['feed','Mural'],['following','Seguindo'],['groups','Grupos'],['profile','Meu perfil']].map(([k,v])=>`<button data-social="nav" data-page="${k}" class="${ui.page===k?'active':''}">${v}</button>`).join('')}</div>`;
}
function avatar(n){return `<span class="social-avatar">${sx(initials(n))}</span>`;}
function emptyHtml(title,desc,action=''){return `<div class="social-blank"><strong>${sx(title)}</strong><p>${sx(desc)}</p>${action}</div>`;}
function activityCard(a,groupId=''){
 const you=a.ownerId===ui.user?.uid;
 return `<article class="card social-card"><div class="social-card-header">${avatar(nameOf(a.ownerId))}<div class="social-card-title"><strong>${sx(nameOf(a.ownerId))}${you?' · você':''}</strong><small>${sx(day(a.date))} · ${a.type==='run'?'Corrida':'Musculação'}</small></div><span class="social-bubble">${a.type==='run'?'Corrida':'Força'}</span></div>
 <h3>${sx(a.title)}</h3>
 <div class="social-details">${a.distance?`<span class="social-detail">${fmt(a.distance)} km</span>`:''}${a.duration?`<span class="social-detail">${fmt(a.duration,0)} min</span>`:''}${a.type==='run'&&a.distance&&a.duration?`<span class="social-detail">${fmt(a.duration/a.distance)} min/km</span>`:''}${a.type==='strength'?`<span class="social-detail">${(a.details||[]).length} exercícios</span>`:''}</div>
 ${(a.details||[]).length?`<ul class="social-activity">${a.details.slice(0,12).map(s=>`<li>${sx(s)}</li>`).join('')}</ul>`:''}
 ${you?`<div class="social-actions"><button class="btn danger" data-social="remove-activity" data-id="${sx(a.id)}" data-group="${sx(groupId)}">${i('trash')} Remover publicação</button></div>`:''}</article>`;
}
function feedHtml(followingOnly=false){
 const visible=followingOnly?ui.feed.filter(a=>ui.friends.some(f=>f.id===a.ownerId)):ui.feed;
 return `<div class="social-grid"><div class="social-stack"><div class="section-row" style="margin-top:0"><h2 class="section-title">${followingOnly?'Treinos de quem você segue':'Atividades compartilhadas'}</h2><button class="subtle-link" data-social="refresh">${i('clock')} Atualizar</button></div>
 ${visible.length?visible.map(a=>activityCard(a)).join(''):emptyHtml('Nenhuma atividade por aqui.',followingOnly?'Siga alguém pelo código e acompanhe seus treinos publicados.':'Quando alguém compartilhar um treino, ele vai aparecer aqui.')}</div>
 <div class="social-stack"><div class="card social-card"><h3>${followingOnly?'Encontrar alguém':'O que você controla'}</h3><p>Atividades não são publicadas automaticamente. Você escolhe o treino e onde compartilhá-lo.</p><div class="social-actions"><button class="btn soft" data-social="share-open">${i('plus')} Compartilhar</button></div></div>
 ${followCard()}
 <div class="card social-card"><h3>Seus grupos</h3><p>${ui.groups.length} ${ui.groups.length===1?'grupo':'grupos'} que você participa.</p><div class="social-actions"><button class="btn" data-social="nav" data-page="groups">Ver grupos ${i('chevronright')}</button></div></div></div></div>`;
}
function followCard(){return `<div class="card social-card"><h3>Seguir um atleta</h3><p>Use o código que a pessoa encontra em “Meu perfil”.</p><form id="social-follow-form" class="social-form" style="margin-top:12px"><div class="social-form-row"><div><label for="social-code">Código do atleta</label><input id="social-code" name="code" required maxlength="30" placeholder="Ex.: P9a8b7c6d5" /></div><button type="submit" class="btn primary">Buscar e seguir</button></div></form>
 ${ui.friends.length?`<div class="section-row" style="margin:17px 0 8px"><h3 class="section-title" style="font-size:13px">Seguindo (${ui.friends.length})</h3></div>${ui.friends.map(f=>`<div class="social-leader">${avatar(nameOf(f.id))}<strong style="flex:1">${sx(nameOf(f.id))}</strong><button class="btn" data-social="unfollow" data-id="${sx(f.id)}">Deixar</button></div>`).join('')}`:''}</div>`;}
function groupsHtml(){return `<div class="social-grid"><div class="social-stack"><div class="section-row" style="margin-top:0"><h2 class="section-title">Meus grupos</h2><span class="micro">${ui.groups.length} grupos</span></div>
 ${ui.groups.length?`<div class="plans-list">${ui.groups.map(g=>`<article class="card social-group"><div class="social-card-header" style="margin:0">${avatar(g.title)}<div class="social-card-title"><strong>${sx(g.title)}</strong><small>${g.memberIds?.length||1} participantes</small></div></div><p class="micro">${sx(g.description||'Treinem juntos e acompanhem suas metas.')}</p><div class="social-actions"><button class="btn primary" data-social="open-group" data-id="${sx(g.id)}">Abrir grupo ${i('chevronright')}</button><button class="btn" data-social="copy-group" data-id="${sx(g.id)}">${i('copy')} Convite</button></div></article>`).join('')}</div>`:emptyHtml('Você ainda não está em um grupo.','Crie um grupo com amigos ou entre com um código de convite.')}
 </div><div class="social-stack"><div class="card social-card"><h3>Criar grupo</h3><form class="social-form" id="social-create-group"><div><label>Nome do grupo</label><input name="name" required maxlength="48" placeholder="Ex.: Equipe 5K" /></div><div><label>Descrição (opcional)</label><input name="description" maxlength="120" placeholder="Ex.: Desafio dos amigos" /></div><button class="btn primary" type="submit">${i('plus')} Criar grupo</button></form></div>
 <div class="card social-card"><h3>Entrar por convite</h3><p>Peça a um amigo o código do grupo.</p><form id="social-join-group" class="social-form" style="margin-top:11px"><div><label>Código de convite</label><input name="code" required maxlength="50" placeholder="Cole o código do grupo" /></div><button class="btn" type="submit">Entrar no grupo</button></form></div></div></div>`;}
function challengeValue(ch,a){if(a.date<ch.start||a.date>ch.end)return 0;return ch.metric==='distance'?(a.type==='run'?sn(a.distance):0):ch.metric==='minutes'?sn(a.duration):1;}
function rankingHtml(ch){const values={};for(const a of ui.groupFeed){values[a.ownerId]=(values[a.ownerId]||0)+challengeValue(ch,a);}return Object.entries(values).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([id,val],pos)=>`<div class="social-leader"><span class="social-rank">${pos+1}</span><strong style="flex:1">${sx(nameOf(id))}</strong><span>${fmt(val)} ${ch.metric==='distance'?'km':ch.metric==='minutes'?'min':'treinos'}</span></div>`).join('')||'<p class="micro">Ainda não há atividades compartilhadas neste período.</p>';}
function challengeCard(ch){const mine=ui.groupFeed.reduce((sum,a)=>sum+(a.ownerId===ui.user?.uid?challengeValue(ch,a):0),0);
 return `<div class="card social-card"><div class="social-card-header"><span class="plan-type-icon">${i('target')}</span><div class="social-card-title"><strong>${sx(ch.title)}</strong><small>${day(ch.start)} até ${day(ch.end)}</small></div><span class="social-bubble">${ch.metric==='sessions'?'Frequência':ch.metric==='distance'?'Distância':'Tempo'}</span></div><p>Sua meta: <strong>${fmt(ch.target)} ${ch.metric==='distance'?'km':ch.metric==='minutes'?'minutos':'treinos'}</strong></p><div class="social-statline"><span>Seu progresso: <strong>${fmt(mine)}</strong> de ${fmt(ch.target)}</span><span>${Math.min(100,Math.round(mine/Math.max(ch.target,1)*100))}%</span></div><div class="social-bar"><i style="width:${Math.min(100,Math.max(0,mine/ch.target*100))}%"></i></div><h3 style="margin-top:17px">Classificação do grupo</h3>${rankingHtml(ch)}<p class="social-footnote">O placar contabiliza somente treinos compartilhados com este grupo.</p></div>`;}
function groupHtml(){const g=ui.group;if(!g)return groupsHtml();return `<div class="social-stack"><div class="social-actions" style="margin:0"><button class="btn" data-social="back-groups">${i('chevronleft')} Meus grupos</button><button class="btn" data-social="copy-group" data-id="${sx(g.id)}">${i('copy')} Copiar convite</button></div>
 <div class="card social-card"><div class="social-card-header">${avatar(g.title)}<div class="social-card-title"><strong style="font-size:18px">${sx(g.title)}</strong><small>${g.memberIds?.length||1} participantes</small></div></div><p>${sx(g.description||'Uma equipe para se motivar.')}</p><p class="social-footnote">O convite é um código de acesso: compartilhe apenas com quem deseja no grupo.</p></div>
 <div class="social-grid"><div class="social-stack"><div class="section-row" style="margin:5px 0 0"><h2 class="section-title">Desafios do grupo</h2></div>${ui.challenges.length?ui.challenges.map(challengeCard).join(''):emptyHtml('Nenhum desafio ainda.','Crie um desafio para motivar o grupo.')}
 <div class="section-row" style="margin:14px 0 0"><h2 class="section-title">Treinos compartilhados</h2></div>${ui.groupFeed.length?ui.groupFeed.map(a=>activityCard(a,g.id)).join(''):emptyHtml('Nenhum treino compartilhado.','Compartilhe um treino concluído para aparecer no grupo.')}</div>
 <div class="social-stack"><div class="card social-card"><h3>Novo desafio</h3><form class="social-form" id="social-create-challenge"><div><label>Título</label><input name="title" maxlength="60" required placeholder="Ex.: 50 km no mês" /></div><div><label>O que será contado?</label><select name="metric"><option value="sessions">Treinos concluídos</option><option value="distance">Quilômetros de corrida</option><option value="minutes">Minutos treinados</option></select></div><div><label>Meta por participante</label><input type="number" name="target" min="1" step="0.1" max="10000" value="10" required /></div><div class="social-split"><div><label>Início</label><input name="start" type="date" value="${futureDate(0)}" required /></div><div><label>Fim</label><input name="end" type="date" value="${futureDate(30)}" required /></div></div><button class="btn primary" type="submit">${i('plus')} Criar desafio</button></form></div>
 <div class="card social-card"><h3>Participantes</h3>${(g.memberIds||[]).map(id=>`<div class="social-leader">${avatar(nameOf(id))}<strong>${sx(nameOf(id))}</strong>${id===g.ownerId?'<span class="social-bubble">Criador</span>':''}</div>`).join('')}</div>${g.ownerId===ui.user.uid?'':`<button class="btn danger full" data-social="leave-group" data-id="${sx(g.id)}">Sair deste grupo</button>`}</div></div></div>`;}
function futureDate(n){const d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function profileHtml(){return `<div class="social-grid"><div class="social-stack"><div class="card social-card"><div class="social-card-header">${accountAvatar()}<div class="social-card-title"><strong>${sx(ui.profile?.name||'Atleta')}</strong><small>${sx(ui.user?.email||'')}</small></div></div><form id="social-profile-form" class="social-form"><div><label>Nome exibido</label><input required name="name" maxlength="44" value="${sx(ui.profile?.name||'')}" /></div><button class="btn soft" type="submit">Salvar meu nome</button></form></div><div class="card social-card"><h3>Seu código de atleta</h3><p>Passe este código para alguém seguir suas atividades compartilhadas.</p><div class="social-code">${sx(ui.profile?.code||'—')}</div><button class="btn" data-social="copy-profile">${i('copy')} Copiar código</button></div></div>
 <div class="social-stack"><div class="card social-card"><h3>Privacidade</h3><p>Planos, cargas, notas e treinos ficam privados. Quando você escolhe compartilhar, apenas os dados exibidos na confirmação são publicados para a audiência selecionada.</p><p>Na comunidade, qualquer pessoa com uma conta pode ver a publicação. Nos grupos, apenas integrantes podem ler os registros.</p></div>
 <div class="card social-card"><h3>Sincronização</h3><p>Ao entrar em sua conta, seus treinos pessoais são sincronizados na nuvem e entre aparelhos conectados com este mesmo login.</p><p class="social-footnote">${sx(ui.syncLabel||'Sincronização ativada.')}</p><div class="social-actions"><button class="btn" data-social="sync-now">${i('upload')} Sincronizar agora</button></div></div>

function shareHtml(){const all=window.PulsoLocal?.get?.().workouts||[];const done=all.filter(w=>w.status==='done').sort((a,b)=>(b.result?.completedAt||b.date).localeCompare(a.result?.completedAt||a.date)).slice(0,75);

 ${done.length?`<form class="social-form" id="social-share-form" style="margin-top:16px"><div><label>Treino realizado</label><select required name="workout">${done.map(w=>`<option value="${sx(w.id)}">${sx(day(w.date))} · ${sx(w.title)}</option>`).join('')}</select></div><div><label>Compartilhar com</label><select required name="audience"><option value="public">Comunidade (todos com login)</option>${ui.groups.map(g=>`<option value="group:${sx(g.id)}">Grupo: ${sx(g.title)}</option>`).join('')}</select></div><div><label>Duração real da sessão (min) · opcional</label><input type="number" name="minutes" min="0" max="1440" step="1" placeholder="Para pontuar em desafios por tempo" /></div><p class="social-footnote">Compartilha nome do treino, data, modalidade e resumo de exercícios/distância/tempo. Observações pessoais não são compartilhadas.</p><button class="btn primary" type="submit">${i('check')} Confirmar compartilhamento</button></form>`:emptyHtml('Sem treinos concluídos.','Marque um treino como realizado na aba Hoje antes de compartilhar.')}
 <div class="social-actions"><button class="btn" data-social="share-close">Cancelar</button></div></div>`;}
function mount(){renderAccountUi();const root=socialRoot();if(!root)return;
 if(!configured||!ui.user){root.innerHTML=authHtml();return;}
 if(!ui.ready){root.innerHTML=`<div class="card social-card"><h3>Preparando sua comunidade...</h3><p>Carregando seus dados de conta.</p></div>`;return;}
 root.innerHTML=topHtml()+(ui.page==='share'?shareHtml():ui.page==='following'?feedHtml(true):ui.page==='groups'?groupsHtml():ui.page==='group'?groupHtml():ui.page==='profile'?profileHtml():feedHtml(false));
}
window.PulsoSocial = {mount,renderAccountUi,scheduleSync(){if(!ui.user||!ui.ready||paused)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncLocal(false),700);}};
async function profileEnsure(user){const ref=fire.doc(db,'profiles',user.uid),snap=await fire.getDoc(ref);if(snap.exists())return {id:user.uid,...snap.data()};
 const profile={name:String(user.displayName||registeringName||user.email?.split('@')[0]||'Atleta').slice(0,44),code:'P'+user.uid.slice(0,12),createdAt:Date.now()};
 await fire.setDoc(ref,profile);return {id:user.uid,...profile};}
async function loadPeople(ids=[]){for(const uid of [...new Set(ids.filter(Boolean))]){if(ui.people[uid])continue;try{const r=await fire.getDoc(fire.doc(db,'profiles',uid));if(r.exists())ui.people[uid]=r.data();}catch(e){console.warn('Perfil indisponível:',e);}}}
async function loadFollows(){const res=await fire.getDocs(fire.collection(db,'follows',ui.user.uid,'users'));ui.friends=res.docs.map(d=>({id:d.id,...d.data()}));await loadPeople(ui.friends.map(f=>f.id));}
async function loadGroups(){const r=await fire.getDocs(fire.collection(db,'memberships',ui.user.uid,'groups'));const list=[];
 for(const d of r.docs){try{const g=await fire.getDoc(fire.doc(db,'groups',d.id));if(g.exists()&&g.data().memberIds?.includes(ui.user.uid))list.push({id:g.id,...g.data()});}catch(e){console.warn('Grupo indisponível:',e);}}
 ui.groups=list;await loadPeople(list.flatMap(g=>g.memberIds||[]));}
async function loadFeed(){const q=fire.query(fire.collection(db,'activities'),fire.orderBy('createdAt','desc'),fire.limit(60));const r=await fire.getDocs(q);ui.feed=r.docs.map(d=>({id:d.id,...d.data()}));await loadPeople(ui.feed.map(a=>a.ownerId));}
async function loadGroup(gid){const g=ui.groups.find(a=>a.id===gid);if(!g){showToast('Você não participa deste grupo.');return;}
 ui.group=g;ui.page='group';mount();const [a,c]=await Promise.all([
  fire.getDocs(fire.query(fire.collection(db,'groups',gid,'activities'),fire.orderBy('createdAt','desc'),fire.limit(400))),
  fire.getDocs(fire.query(fire.collection(db,'groups',gid,'challenges'),fire.orderBy('createdAt','desc'),fire.limit(40)))
 ]);
 ui.groupFeed=a.docs.map(d=>({id:d.id,...d.data()}));ui.challenges=c.docs.map(d=>({id:d.id,...d.data()}));await loadPeople(ui.groupFeed.map(t=>t.ownerId));mount();}
async function syncLocal(force=false){if(!ui.user||(!ui.ready&&!force)||paused)return;
 const id=ui.user.uid,payload={...window.PulsoLocal.get(),updatedAt:Date.now(),version:4};
 ui.syncLabel='Sincronizando...';
 saveChain=saveChain.then(async()=>{
   await fire.setDoc(fire.doc(db,'accounts',id,'data','main'),payload);
   ui.syncLabel='Última sincronização: '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 }).catch(e=>{ui.syncLabel='Falha ao sincronizar: '+errorMessage(e);notifyError(e);});
 await saveChain;
}
async function initializeAccount(user){paused=true;ui.ready=false;ui.group=null;ui.page='feed';ui.accountOpen=false;ui.user=user;ui.people={};ui.feed=[];ui.friends=[];ui.groups=[];ui.lastError='';
 window.PulsoLocal?.switchAccount(user.uid);mount();
 try{
  const [prof,remote]=await Promise.all([profileEnsure(user),fire.getDoc(fire.doc(db,'accounts',user.uid,'data','main'))]);
  if(auth.currentUser?.uid!==user.uid)return;
  ui.profile=prof;ui.people[user.uid]=prof;
  let local=window.PulsoLocal.get();const guest=window.PulsoLocal.getGuest();
  if(remote.exists()){
    const cloud=remote.data();const merged={workouts:[...(cloud.workouts||[])],templates:[...(cloud.templates||[])]};
    // Os dados deste mesmo login são os da nuvem. Não sobrescrever dados de outro aparelho.
    const unlinked=local.workouts.length||local.templates.length;
    if(unlinked && !localStorage.getItem('pulso_synced_'+user.uid)){
      if(confirm('Este login já tem treinos salvos na nuvem.\n\nOK = importar também os treinos locais deste mesmo login (sem substituir os da nuvem).\nCancelar = usar somente os treinos da nuvem.')){
        const a=new Map(merged.workouts.map(w=>[w.id,w]));for(const w of local.workouts)a.set(w.id,w);merged.workouts=[...a.values()];
        const b=new Map(merged.templates.map(w=>[w.id,w]));for(const w of local.templates)b.set(w.id,w);merged.templates=[...b.values()];
      }
    }
    window.PulsoLocal.setAccount(merged);
  } else {
    if(!local.workouts.length&&!local.templates.length&&(guest.workouts.length||guest.templates.length) && confirm('Encontrei treinos da versão antiga neste navegador.\n\nDeseja copiá-los para sua conta nova?\n\nEles continuarão preservados no navegador também.')){
      window.PulsoLocal.setAccount(guest);
    }
  }
  localStorage.setItem('pulso_synced_'+user.uid,'1');
  ui.ready=true;paused=false;
  await Promise.all([loadGroups(),loadFollows(),loadFeed()]);
  mount();await syncLocal(true);
 }catch(e){ui.ready=true;paused=false;notifyError(e);}
}
async function doAuth(form){if(!configured)return;const fd=new FormData(form);setBusy(true);
 try{
  const email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');
  if(ui.authMode==='register'){
   const name=String(fd.get('name')||'').trim();if(name.length<2)throw Error('Digite um nome com pelo menos 2 caracteres.');
   registeringName=name;const result=await fire.createUserWithEmailAndPassword(auth,email,password);
   await fire.updateProfile(result.user,{displayName:name});
   await fire.setDoc(fire.doc(db,'profiles',result.user.uid),{name,code:'P'+result.user.uid.slice(0,12),createdAt:Date.now()});
   ui.profile={name,code:'P'+result.user.uid.slice(0,12)};ui.people[result.user.uid]=ui.profile;registeringName=null;
   showToast('Conta criada! Bem-vindo ao Pulso.');
  }else {await fire.signInWithEmailAndPassword(auth,email,password);showToast('Você entrou no Pulso.');}
 }catch(e){notifyError(e);}finally{setBusy(false);}
}
async function doFollow(form){const code=String(new FormData(form).get('code')||'').trim();if(!code)return;
 const q=fire.query(fire.collection(db,'profiles'),fire.where('code','==',code),fire.limit(2));const snap=await fire.getDocs(q);
 if(snap.empty)throw Error('Nenhum atleta encontrado com esse código.');const p=snap.docs[0];if(p.id===ui.user.uid)throw Error('Esse código é seu.');
 await fire.setDoc(fire.doc(db,'follows',ui.user.uid,'users',p.id),{createdAt:Date.now()});
 ui.people[p.id]=p.data();await loadFollows();showToast('Agora você segue '+p.data().name+'.');mount();}
async function createGroup(form){const d=new FormData(form),name=String(d.get('name')||'').trim().slice(0,48);if(name.length<3)throw Error('O nome do grupo precisa ter pelo menos 3 caracteres.');
 const ref=fire.doc(fire.collection(db,'groups'));const g={ownerId:ui.user.uid,title:name,description:String(d.get('description')||'').trim().slice(0,120),memberIds:[ui.user.uid],createdAt:Date.now()};
 await fire.setDoc(ref,g);await fire.setDoc(fire.doc(db,'memberships',ui.user.uid,'groups',ref.id),{joinedAt:Date.now()});await loadGroups();showToast('Grupo criado! Compartilhe o convite.');mount();}
async function joinGroup(form){const code=String(new FormData(form).get('code')||'').trim();if(!/^[a-zA-Z0-9]{15,30}$/.test(code))throw Error('Código de grupo inválido.');
 const ref=fire.doc(db,'groups',code),s=await fire.getDoc(ref);if(!s.exists())throw Error('Grupo não encontrado.');const g=s.data();
 if(!g.memberIds?.includes(ui.user.uid)){
   if(g.memberIds.length>=100)throw Error('Este grupo atingiu o limite de 100 pessoas.');
   await fire.updateDoc(ref,{memberIds:fire.arrayUnion(ui.user.uid)});
 }
 await fire.setDoc(fire.doc(db,'memberships',ui.user.uid,'groups',code),{joinedAt:Date.now()});await loadGroups();showToast('Você entrou no grupo!');mount();}
async function leaveGroup(gid){const g=ui.groups.find(x=>x.id===gid);if(!g)return;
 if(g.ownerId===ui.user.uid && g.memberIds.length>1)throw Error('O criador só pode sair depois que os outros membros saírem.');
 if(g.ownerId===ui.user.uid)throw Error('O criador não pode sair. Se quiser, crie outro grupo.');
 await fire.updateDoc(fire.doc(db,'groups',gid),{memberIds:fire.arrayRemove(ui.user.uid)});
 await fire.deleteDoc(fire.doc(db,'memberships',ui.user.uid,'groups',gid));ui.group=null;ui.page='groups';await loadGroups();mount();showToast('Você saiu do grupo.');}
function serializeWorkout(w,minutesOverride=0){const r=w.result?.run||w.run||{};const strength=w.result?.strength?.length?w.result.strength:w.strength||[];const type=w.type;
 const distance=type==='run'?sn(r.distance):0,duration=minutesOverride|| (type==='run'?sn(r.duration):0);
 let details=type==='strength'?strength.filter(x=>x.name).slice(0,14).map(x=>`${String(x.name).slice(0,70)} · ${sn(x.sets)||'?'} séries × ${String(x.reps||'?').slice(0,15)}${sn(x.weight)?' · '+fmt(x.weight)+' kg':''}`):
    runDescription(r);
 return {ownerId:ui.user.uid,title:String(w.title||'Treino').slice(0,90),date:w.date,type,distance,duration,details,createdAt:Date.now()};
}
function runDescription(r){const p=r.params||{},out=[],k=r.kind||'easy';const labels={easy:'Corrida leve',recovery:'Regenerativo',long:'Longão',intervals:'Intervalado',fartlek:'Fartlek',tempo:'Tempo run',progressive:'Progressivo',hills:'Subidas',racepace:'Ritmo de prova',strides:'Educativos e acelerações'};
 out.push(labels[k]||'Corrida');
 if(p.warmup)out.push('Aquecimento: '+fmt(p.warmup)+' min');
 if(k==='intervals')out.push(`${fmt(p.repeats,0)} × ${p.workMode==='time'?fmt(p.workSeconds,0)+' s':fmt(p.workDistance,0)+' m'} fortes · recuperação de ${fmt(p.recoveryValue)} ${p.recoveryMode==='distance'?'m':'min'}`);
 if(k==='fartlek')out.push(`${fmt(p.repeats,0)} × (${fmt(p.fastMinutes)} min rápido + ${fmt(p.easyMinutes)} min leve)`);
 if(k==='tempo')out.push(`${fmt(p.tempoMinutes)} min em ritmo de limiar`);
 if(k==='progressive')out.push(`Etapas: ${fmt(p.stage1)} + ${fmt(p.stage2)} + ${fmt(p.stage3)} ${p.progressMode==='min'?'min':'km'}`);
 if(k==='hills')out.push(`${fmt(p.repeats,0)} subidas de ${p.hillMode==='time'?fmt(p.hillSeconds,0)+' s':fmt(p.hillDistance,0)+' m'}`);
 if(k==='strides')out.push(`${fmt(p.repeats,0)} acelerações de ${fmt(p.strideDistance,0)} m`);
 if(k==='racepace'&&p.targetPace)out.push('Ritmo-alvo '+String(p.targetPace).slice(0,20)+' min/km');
 if(p.cooldown)out.push('Desaquecimento: '+fmt(p.cooldown)+' min');
 return out.slice(0,8);
}
async function shareWorkout(form){const d=new FormData(form),id=String(d.get('workout')||''),aud=String(d.get('audience')||'');const w=window.PulsoLocal.get().workouts.find(w=>w.id===id&&w.status==='done');if(!w)throw Error('Este treino precisa estar concluído.');
 const mins=sn(d.get('minutes'));if(mins<0||mins>1440)throw Error('Confira a duração informada.');
 const data=serializeWorkout(w,mins),docId=ui.user.uid+'_'+id.replace(/[^a-zA-Z0-9_-]/g,'_');
 if(aud==='public'){await fire.setDoc(fire.doc(db,'activities',docId),data);await loadFeed();ui.page='feed';}
 else if(aud.startsWith('group:')){const gid=aud.slice(6);if(!ui.groups.some(g=>g.id===gid))throw Error('Você não participa deste grupo.');await fire.setDoc(fire.doc(db,'groups',gid,'activities',docId),data);await loadGroup(gid);}
 else throw Error('Escolha onde compartilhar.');
 showToast('Treino compartilhado com sucesso!');mount();}
async function createChallenge(form){if(!ui.group)throw Error('Abra um grupo primeiro.');const f=new FormData(form),start=String(f.get('start')),end=String(f.get('end'));
 if(!/^\d{4}-\d{2}-\d{2}$/.test(start)||!/^\d{4}-\d{2}-\d{2}$/.test(end)||start>end)throw Error('Confira as datas do desafio.');
 const ref=fire.doc(fire.collection(db,'groups',ui.group.id,'challenges'));
 const data={title:String(f.get('title')||'Desafio').trim().slice(0,60),metric:String(f.get('metric')||'sessions'),target:sn(f.get('target')),start,end,createdBy:ui.user.uid,createdAt:Date.now()};
 if(!data.title||!['sessions','distance','minutes'].includes(data.metric)||data.target<=0||data.target>10000)throw Error('Confira os dados do desafio.');
 await fire.setDoc(ref,data);await loadGroup(ui.group.id);showToast('Desafio criado!');}
async function onClick(b){const a=b.dataset.social;try{
 if(a==='google'){doGoogleLogin();}
 else if(a==='auth-view'){ui.authMode=b.dataset.mode;mount();}
 else if(a==='forgot'){const email=prompt('Qual e-mail você usa no Pulso?');if(email){await fire.sendPasswordResetEmail(auth,email.trim());showToast('E-mail de redefinição enviado.');}}
 else if(a==='logout'){if(confirm('Sair desta conta? Seus dados salvos permanecerão na nuvem.'))await fire.signOut(auth);}
 else if(a==='nav'){ui.page=b.dataset.page;ui.group=null;mount();}
 else if(a==='share-open'){ui.page='share';mount();}
 else if(a==='share-close'){ui.page='feed';mount();}
 else if(a==='refresh'){await Promise.all([loadFeed(),loadGroups(),loadFollows()]);if(ui.group)await loadGroup(ui.group.id);mount();showToast('Atualizado.');}
 else if(a==='unfollow'){await fire.deleteDoc(fire.doc(db,'follows',ui.user.uid,'users',b.dataset.id));await loadFollows();mount();}
 else if(a==='open-group')await loadGroup(b.dataset.id);
 else if(a==='back-groups'){ui.group=null;ui.page='groups';mount();}
 else if(a==='copy-profile'){await navigator.clipboard.writeText(ui.profile.code);showToast('Código copiado.');}
 else if(a==='copy-group'){await navigator.clipboard.writeText(b.dataset.id);showToast('Convite copiado.');}
 else if(a==='sync-now'){await syncLocal(true);showToast('Treinos sincronizados.');mount();}
 else if(a==='remove-activity'){
  if(!confirm('Remover esta publicação? O treino pessoal continuará salvo.'))return;
  const id=b.dataset.id,gid=b.dataset.group;
  if(gid){await fire.deleteDoc(fire.doc(db,'groups',gid,'activities',id));await loadGroup(gid);}else{await fire.deleteDoc(fire.doc(db,'activities',id));await loadFeed();mount();}
  showToast('Publicação removida.');
 }
 else if(a==='leave-group'){if(confirm('Sair deste grupo?'))await leaveGroup(b.dataset.id);}
 }catch(e){notifyError(e);}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-social]');if(b){event.preventDefault();onClick(b);}});
document.addEventListener('click',event=>{const b=event.target.closest('[data-account]');if(b){event.preventDefault();accountClick(b).catch(notifyError);}else if(ui.accountOpen&&!event.target.closest('#pulso-account-menu'))closeAccountMenu();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeAccountMenu();});
window.addEventListener('resize',()=>{if(ui.accountOpen)placeAccountMenu();});
window.addEventListener('scroll',()=>{if(ui.accountOpen)closeAccountMenu();},{passive:true});
document.addEventListener('error',event=>{if(event.target.matches?.('.account-avatar img'))event.target.remove();},true);
document.addEventListener('submit',async event=>{const form=event.target;if(!form.id?.startsWith('social-'))return;event.preventDefault();
 if(ui.busy)return;const method={
  'social-auth-form':doAuth,'social-follow-form':doFollow,'social-create-group':createGroup,'social-join-group':joinGroup,
  'social-share-form':shareWorkout,'social-create-challenge':createChallenge,
  'social-profile-form':async f=>{const name=String(new FormData(f).get('name')||'').trim();if(name.length<2)throw Error('Digite um nome maior.');await fire.updateDoc(fire.doc(db,'profiles',ui.user.uid),{name});ui.profile.name=name;ui.people[ui.user.uid].name=name;await fire.updateProfile(ui.user,{displayName:name});mount();showToast('Perfil atualizado.');}
 }[form.id];if(!method)return;
 setBusy(true);try{await method(form);}catch(e){notifyError(e);}finally{setBusy(false);}
});
if(configured){
 try{
  const [appMod,authMod,fsMod]=await Promise.all([
   import('https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'),
   import('https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js'),
   import('https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js')
  ]);
  fire={...authMod,...fsMod};const app=appMod.initializeApp(FIREBASE_CONFIG);auth=authMod.getAuth(app);db=fsMod.getFirestore(app);
  unsubAuth=authMod.onAuthStateChanged(auth,user=>{
   if(user){initializeAccount(user);}else{paused=true;clearTimeout(saveTimer);ui.user=null;ui.ready=false;ui.profile=null;ui.page='feed';ui.groups=[];ui.friends=[];ui.feed=[];ui.group=null;ui.accountOpen=false;window.PulsoLocal?.switchAccount(null);mount();}
  },notifyError);
 }catch(e){notifyError(e);}
}
mount();
