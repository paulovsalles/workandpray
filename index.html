<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f3" />
  <meta name="description" content="Pulso — planejamento simples de musculação e corrida, com calendário e registro de treinos." />
  <title>Pulso — meu treino</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f5f7f3; --surface:#ffffff; --surface-2:#f8faf7; --ink:#203028;
      --muted:#79857c; --border:#e5eae3; --green:#2f7150; --green-soft:#e7f2e9;
      --green-strong:#235a3f; --orange:#d87754; --orange-soft:#fbede5;
      --shadow:0 12px 34px rgba(31,57,37,.045); --scrim:rgba(13,27,19,.46);
      --red:#c95a56; --red-soft:#faecea; --radius:22px;
    }
    :root[data-theme="dark"] {
      color-scheme:dark;
      --bg:#121a16; --surface:#1b2620; --surface-2:#222f27; --ink:#eef4ed;
      --muted:#9daea0; --border:#34443a; --green:#a0d6ad; --green-soft:#293f30;
      --green-strong:#c7ebcf; --orange:#f0ae8c; --orange-soft:#44342b;
      --shadow:0 12px 34px rgba(0,0,0,.14); --scrim:rgba(0,0,0,.68);
      --red:#f29b92; --red-soft:#4a2e2d;
    }
    *{box-sizing:border-box}
    html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.52 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;letter-spacing:-.012em}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
    button:disabled{cursor:not-allowed;opacity:.52}
    button, .card, input, textarea {transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease}
    .icon{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .icon-sm{width:16px;height:16px}.icon-lg{width:24px;height:24px}
    .shell{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr);max-width:1650px;margin:0 auto}
    .sidebar{position:sticky;top:0;height:100dvh;padding:31px 19px 27px 24px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 14px 35px;text-decoration:none;color:var(--ink)}
    .brand-mark{height:37px;width:37px;border-radius:14px;background:var(--green);color:var(--bg);display:grid;place-items:center}
    .brand-mark .icon{width:23px;height:23px;stroke-width:2.2}
    .brand-word{font-size:25px;letter-spacing:-1.35px;font-weight:800;line-height:1}
    .side-caption{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);padding:12px 16px}
    .side-nav{display:grid;gap:5px}.nav-btn{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 15px;width:100%;border:0;background:transparent;border-radius:15px;color:var(--muted);font-weight:670}
    .nav-btn:hover{background:var(--surface-2);color:var(--ink)}.nav-btn.active{background:var(--green-soft);color:var(--green-strong)}
    .side-bottom{margin-top:auto;padding:0 7px}.side-note{border-radius:20px;padding:19px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:15px}
    .side-note .top{font-size:12px;font-weight:750;display:flex;align-items:center;gap:8px}.side-note p{font-size:12px;color:var(--muted);margin:8px 0 0}
    .side-settings{display:flex;gap:7px}.side-settings button{flex:1}
    .main-wrap{min-width:0}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;border-bottom:1px solid var(--border)}
    .topbar-sub{font-weight:600;font-size:13px;color:var(--muted)}
    .top-actions{display:flex;align-items:center;gap:10px}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:43px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:13px;padding:10px 15px;font-weight:760;font-size:13px;white-space:nowrap}
    .btn:hover{filter:brightness(.985);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
    .btn.primary{background:var(--green-strong);color:#fff;border-color:var(--green-strong)}
    :root[data-theme="dark"] .btn.primary{background:#9ed1aa;color:#14251b;border-color:#9ed1aa}
    .btn.soft{background:var(--green-soft);color:var(--green-strong);border-color:transparent}
    .btn.orange{background:var(--orange-soft);color:var(--orange);border-color:transparent}
    .btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
    .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .btn.icon-only{width:43px;padding:0}.btn.full{width:100%}
    .content{max-width:1100px;margin:0 auto;padding:39px 52px 125px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
    .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:820;color:var(--green);margin-bottom:10px}
    .page-title{font-size:clamp(29px,3vw,42px);line-height:1.13;letter-spacing:-1.9px;margin:0;font-weight:810}
    .page-subtitle{margin:10px 0 0;color:var(--muted);font-size:14px}
    .head-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
    .desktop-hide{display:none}
    .card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
    .hero{position:relative;isolation:isolate;overflow:hidden;background:#234c38;border-radius:27px;padding:30px 33px 28px;color:#f1f7ef;display:flex;min-height:193px;justify-content:space-between;align-items:flex-end;gap:24px}
    :root[data-theme="dark"] .hero{background:#294936}
    .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
    .hero::before{width:320px;height:320px;right:-95px;top:-200px;border:54px solid rgba(176,220,172,.12)}
    .hero::after{width:165px;height:165px;right:145px;bottom:-145px;border:35px solid rgba(176,220,172,.09)}
    .hero-kicker{display:flex;align-items:center;gap:8px;color:#c7e8ce;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.13em}
    .hero h2{font-size:clamp(24px,2.7vw,34px);margin:14px 0 8px;line-height:1.15;letter-spacing:-1px;max-width:510px}
    .hero p{margin:0;color:#c9decf;font-size:13px;max-width:420px}
    .hero-btn{background:#eef8ec;border:0;color:#244632;border-radius:13px;padding:12px 17px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:8px}
    .hero-btn:hover{background:#fff}
    .section-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:29px 0 14px}
    .section-title{font-size:17px;font-weight:810;letter-spacing:-.5px;margin:0}
    .micro{font-size:12px;color:var(--muted)}
    .subtle-link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:760;font-size:12px;display:inline-flex;align-items:center;gap:5px}
    .day-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:24px 0 0}
    .day-chip{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 3px 10px;display:flex;align-items:center;flex-direction:column;gap:5px;color:var(--ink);min-height:82px}
    .day-chip .dow{font-size:11px;color:var(--muted);font-weight:720}
    .day-chip .num{font-size:17px;font-weight:780;line-height:1.3}
    .day-chip.selected{background:var(--green-strong);color:#fff;border-color:var(--green-strong)}
    .day-chip.selected .dow{color:#d3e5d9}
    .day-chip.today:not(.selected){border-color:var(--green)}
    :root[data-theme="dark"] .day-chip.selected{color:#193022}
    :root[data-theme="dark"] .day-chip.selected .dow{color:#3b674b}
    :root[data-theme="dark"] .day-chip.selected .dot:not(.run){background:#275b3d}
    .day-dots{display:flex;height:5px;gap:3px;align-items:center}.dot{height:5px;width:5px;border-radius:50%;display:block;background:var(--green)}.dot.run{background:var(--orange)}.dot.done{opacity:.55}.day-chip.selected .dot:not(.run){background:#e7f9e8}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:27px 0 0}
    .stat{padding:20px 21px;min-height:113px}
    .stat-top{font-size:12px;color:var(--muted);font-weight:650;display:flex;align-items:center;justify-content:space-between}
    .stat-value{margin-top:9px;font-size:31px;letter-spacing:-1.3px;font-weight:850;line-height:1.1}.stat-value small{font-size:12px;letter-spacing:0;color:var(--muted);font-weight:650}
    .stat-icon{color:var(--green)}
    .workout-list{display:grid;gap:10px}
    .workout{padding:16px 18px;display:flex;gap:13px;align-items:center;min-width:0}
    .workout-symbol{width:47px;height:47px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-strong)}
    .workout.run .workout-symbol{background:var(--orange-soft);color:var(--orange)}
    .workout-content{flex:1;min-width:0}.workout-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.workout-title{font-size:14px;line-height:1.28;font-weight:800;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%}
    .workout-info{font-size:12px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .status{font-size:10px;padding:3px 7px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-weight:790;white-space:nowrap}
    .status.done{background:var(--green-soft);border-color:transparent;color:var(--green-strong)}
    .status.skipped{background:var(--red-soft);border-color:transparent;color:var(--red)}
    .workout-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}
    .mini-action{min-height:37px;border-radius:11px;border:1px solid var(--border);background:var(--surface);padding:8px 10px;font-weight:780;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink)}
    .mini-action.finish{background:var(--green-soft);color:var(--green-strong);border-color:transparent}
    .mini-action.checked{background:var(--green-soft);color:var(--green-strong);border-color:transparent}
    .empty{padding:33px 22px;text-align:center;border:1px dashed var(--border);border-radius:22px;background:var(--surface)}
    .empty-visual{margin:0 auto 13px;width:53px;height:53px;border-radius:18px;background:var(--green-soft);color:var(--green-strong);display:grid;place-items:center}
    .empty h3{font-size:15px;margin:0 0 5px}.empty p{font-size:12px;color:var(--muted);max-width:330px;margin:0 auto 16px}
    .empty-acts{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
    .flex-header{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .month-controls{display:flex;align-items:center;gap:9px}.month-controls .btn{min-width:38px;min-height:38px}.month-label{font-size:15px;font-weight:790;min-width:152px;text-align:center}
    .month-card{padding:25px 25px 20px}
    .calendar-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:9px}
    .weekday{text-align:center;font-size:11px;font-weight:820;color:var(--muted);padding:8px 0}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .calendar-day{height:76px;border:1px solid transparent;border-radius:13px;background:var(--surface-2);color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px;min-width:0}
    .calendar-day.blank{background:transparent;pointer-events:none}
    .calendar-day:not(.blank):hover{border-color:var(--green)}
    .calendar-day.selected{background:var(--green-soft);border-color:var(--green)}
    .calendar-day.today .calendar-day-num{color:var(--green);text-decoration:underline;text-underline-offset:4px}
    .calendar-day-num{font-weight:790;font-size:12px}.cal-dots{display:flex;gap:4px;flex-wrap:wrap}
    .cal-pill{height:6px;width:17px;border-radius:20px;background:var(--green)}.cal-pill.run{background:var(--orange)}.cal-pill.finished{opacity:.45}
    .calendar-foot{margin:18px 0 0;display:flex;gap:16px;color:var(--muted);font-size:11px}.legend{display:flex;align-items:center;gap:6px}.legend .cal-pill{width:10px}
    .progress-card{margin-top:17px;padding:22px}.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}.progress-row strong{font-size:13px}.progress-row span{font-weight:820;color:var(--green);font-size:14px}
    .progress-track{height:8px;background:var(--surface-2);border-radius:50px;overflow:hidden}.progress-fill{height:100%;background:var(--green);border-radius:50px;transition:width .25s}
    .progress-hint{margin-top:9px;color:var(--muted);font-size:12px}
    .type-header{display:flex;justify-content:space-between;align-items:center;margin:19px 0 15px}.filter-pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.filter-pills::-webkit-scrollbar{display:none}
    .filter-btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:9px 14px;color:var(--muted);font-size:12px;font-weight:760;white-space:nowrap}
    .filter-btn.active{background:var(--green-soft);border-color:transparent;color:var(--green-strong)}
    .dated-group{margin-bottom:19px}.date-heading{font-size:12px;font-weight:800;color:var(--muted);text-transform:capitalize;margin:0 0 9px;padding-left:3px}
    .bottom-nav{display:none}
    .overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:18px;overscroll-behavior:contain;backdrop-filter:blur(3px)}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:25px;max-width:570px;width:100%;max-height:min(91dvh,950px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.19)}
    .modal-head{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:23px 25px 17px;border-bottom:1px solid var(--border)}
    .modal-head h2{font-size:21px;letter-spacing:-.7px;line-height:1.2;margin:0}.modal-head p{font-size:12px;margin:5px 0 0;color:var(--muted)}
    .modal-body{padding:23px 25px 25px;overflow-y:auto;overscroll-behavior:contain}
    .modal-foot{padding:15px 25px max(15px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:9px;align-items:center;justify-content:flex-end;flex-shrink:0;background:var(--surface)}
    .field{display:grid;gap:7px;margin-bottom:17px}.field>label,.field-label{font-size:12px;font-weight:800;color:var(--ink)}
    .field input,.field textarea,.field select,.exercise-fields input{border:1px solid var(--border);border-radius:12px;min-height:45px;padding:11px 12px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0;outline:none}
    .field textarea{min-height:72px;resize:vertical}
    .field input:focus,.field textarea:focus,.exercise-fields input:focus{border-color:var(--green);outline:2px solid var(--green-soft)}
    input::placeholder,textarea::placeholder{color:var(--muted);opacity:.76}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .type-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 21px}
    .type-switch button{display:flex;gap:9px;align-items:center;justify-content:center;min-height:49px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-weight:790}
    .type-switch button.active{background:var(--green-soft);color:var(--green-strong);border-color:var(--green)}
    .type-switch button[data-type="run"].active{background:var(--orange-soft);color:var(--orange);border-color:var(--orange)}
    .form-subhead{display:flex;justify-content:space-between;align-items:center;margin:13px 0 12px}
    .form-subhead h3{font-size:13px;margin:0;font-weight:830}.hint{color:var(--muted);font-size:11px}
    .exercise-row{position:relative;border:1px solid var(--border);background:var(--surface-2);padding:13px;border-radius:14px;margin-bottom:9px}
    .exercise-name{display:flex;align-items:center;gap:8px;margin-bottom:9px}
    .exercise-name input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:39px;padding:8px 11px;color:var(--ink);width:100%;min-width:0}
    .exercise-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.exercise-fields label{font-size:10px;color:var(--muted);font-weight:750;display:grid;gap:5px}
    .exercise-fields input{background:var(--surface);font-size:13px;min-height:39px;padding:8px 9px;border-radius:9px}
    .remove-ex{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;line-height:0}.remove-ex:hover{color:var(--red);background:var(--red-soft)}
    .repeat-box{padding:14px;border:1px solid var(--border);background:var(--surface-2);border-radius:15px;margin:14px 0 18px}
    .repeat-label{display:flex;align-items:center;gap:10px;font-weight:780;font-size:13px;cursor:pointer}.repeat-label input{width:18px;height:18px;accent-color:var(--green);margin:0}
    .repeat-box p{font-size:11px;color:var(--muted);margin:5px 0 0 28px}
    .repeat-days{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
    .weekday-toggle{width:39px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;font-weight:800}
    .weekday-toggle.active{border-color:var(--green);background:var(--green-soft);color:var(--green-strong)}
    .detail-section{margin:0 0 24px}.detail-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:820;margin:0 0 12px}
    .detail-list{display:grid;gap:7px}.detail-line{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
    .detail-line strong{font-size:13px}.detail-line span{font-size:12px;color:var(--muted);text-align:right}
    .detail-callout{background:var(--green-soft);border-radius:15px;padding:17px;color:var(--green-strong);display:flex;align-items:center;gap:12px;margin:0 0 21px}
    .detail-callout .icon{width:24px;height:24px}.detail-callout strong{font-size:13px}.detail-callout small{display:block;font-size:11px;margin-top:3px;opacity:.9}
    .note-box{padding:13px 15px;background:var(--surface-2);border-radius:13px;color:var(--ink);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .detail-secondary{display:flex;gap:7px;flex-wrap:wrap}
    .confirm-text{line-height:1.7;font-size:14px;color:var(--muted);margin:0 0 17px}
    .toast{position:fixed;bottom:29px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:12px;font-weight:780;box-shadow:0 10px 35px #0002;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 30px);text-align:center}
    .toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
    .tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.tool-card{border:1px solid var(--border);border-radius:16px;padding:17px;background:var(--surface-2);text-align:left;color:var(--ink)}
    .tool-card strong{display:block;font-size:13px;margin:8px 0 4px}.tool-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
    .guide-note{margin-top:17px;font-size:12px;line-height:1.7;color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .today-quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.today-quick .btn{flex:1}
    .status.plan{background:var(--green-soft);border:0;color:var(--green-strong)}.status.free{background:var(--orange-soft);border:0;color:var(--orange)}
    .plan-summary{border:1px solid var(--border);background:var(--green-soft);border-radius:20px;padding:17px 19px;display:flex;gap:13px;align-items:center;color:var(--green-strong)}
    .plan-summary-icon{width:44px;height:44px;flex-shrink:0;background:var(--surface);border-radius:14px;display:grid;place-items:center}
    .plan-summary strong{display:block;font-size:14px}.plan-summary p{font-size:12px;line-height:1.55;margin:4px 0 0}
    .plans-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.plan-card{padding:18px;min-width:0}.plan-card-top{display:flex;align-items:center;gap:10px}
    .plan-type-icon,.preset-icon{display:grid;place-items:center;flex-shrink:0;width:41px;height:41px;border-radius:13px;background:var(--green-soft);color:var(--green-strong)}
    .plan-type-icon.run,.preset-icon.run{background:var(--orange-soft);color:var(--orange)}
    .plan-card-intro{min-width:0;flex:1}.plan-card-name{font-size:14px;font-weight:820;line-height:1.3}.plan-card-sub{color:var(--muted);font-size:11px;margin-top:4px}
    .plan-period{display:flex;align-items:center;gap:6px;margin:15px 0 13px;color:var(--muted);font-size:12px}.plan-days{display:flex;gap:5px}

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="backup-file" class="sr-only" type="file" accept=".json,application/json" />
<script>
(() => {
  'use strict';
  let STORE = 'pulso_treinos_v1';
  let PLAN_STORE = 'pulso_planos_v2';
  const THEME_KEY = 'pulso_tema_v1';
  const weekdays = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const tabs = [ ['today','Hoje','house'], ['strength','Musculação','dumbbell'], ['run','Corrida','run'], ['plans','Planos','target'], ['month','Meu mês','calendar'], ['social','Comunidade','users'] ];
  const today = localDate(new Date());
  let state;
  let toastTimer;

  function icon(name, extra='') { return `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"></use></svg>`; }
  function esc(value) {return String(value == null ? '' : value).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
  function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function parseDate(str){let [y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d);}
  function addDays(s,n){let d=parseDate(s); d.setDate(d.getDate()+n);return localDate(d);}
  function monthEnd(s){let d=parseDate(s+'-01');return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
  function modMonth(month,n){let d=parseDate(month+'-01');d.setMonth(d.getMonth()+n);return localDate(d).slice(0,7);}
  function monthName(m){let d=parseDate(m+'-01');let label=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(d);return label.charAt(0).toUpperCase()+label.slice(1);}
  function fullDate(s){return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(parseDate(s));}
  function shortDate(s){return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(parseDate(s));}
  function dateGroup(s){return new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'numeric',month:'short'}).format(parseDate(s)).replace(/\.$/,'');}
  function num(v){const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)&&n>0?n:0;}
  function displayNum(v, dec=1){return Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:dec});}
  function uid(){return 'w_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);}
  function dayIndex(s){return (parseDate(s).getDay()+6)%7;}
  function workSorted(arr){return [...arr].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);}
  // Modalidades com parâmetros próprios; os valores são exemplos editáveis, não uma prescrição.
  const RUN_KINDS = {
    easy:{label:'Corrida leve · Easy Run',short:'Leve',desc:'Ritmo confortável: você consegue conversar em frases completas.',example:'5 km em ritmo leve',rpe:'3–4/10',hint:'Mantenha a respiração confortável. Não é um teste de velocidade.',defaults:{distance:5,duration:0,warmup:0,cooldown:0}},
    recovery:{label:'Regenerativo · Recovery',short:'Regenerativo',desc:'Sessão bem fácil para soltar as pernas sem acumular muita fadiga.',example:'25 min bem leves',rpe:'2–3/10',hint:'Se estiver muito cansado, descanso ou caminhada também podem ser opções.',defaults:{distance:0,duration:25,warmup:0,cooldown:0}},
    long:{label:'Longão · Long Run',short:'Longão',desc:'Corrida contínua mais longa, com intensidade predominantemente confortável.',example:'12 km leves',rpe:'3–5/10',hint:'Aumente a duração e a distância gradualmente; hidratação e alimentação dependem do tempo e do clima.',defaults:{distance:12,duration:0,warmup:0,cooldown:0}},
    intervals:{label:'Intervalado · Tiros',short:'Intervalado',desc:'Alterna repetições rápidas e recuperações programadas.',example:'6 × 400 m + 2 min de trote',rpe:'7–9/10',hint:'A qualidade do tiro importa mais do que a velocidade máxima. Mantenha a técnica e controle a recuperação.',defaults:{warmup:10,cooldown:10,repeats:6,workMode:'distance',workDistance:400,workSeconds:60,recoveryMode:'time',recoveryValue:2,recoveryActivity:'Trote',targetPace:''}},
    fartlek:{label:'Fartlek · Variação de ritmo',short:'Fartlek',desc:'Alterna blocos de corrida rápida e leve, com tempo configurável.',example:'5 × (2 min rápidos + 3 min leves)',rpe:'6–8/10 nos blocos fortes',hint:'Os blocos rápidos devem ser fortes, mas sem sprint máximo.',defaults:{warmup:10,cooldown:10,repeats:5,fastMinutes:2,easyMinutes:3,targetPace:''}},
    tempo:{label:'Tempo Run · Limiar',short:'Tempo Run',desc:'Parte principal em ritmo sustentado, firme e controlado.',example:'10 min leves + 20 min fortes + 10 min leves',rpe:'6–8/10',hint:'Forte e sustentável: normalmente você consegue falar poucas palavras, sem entrar em sprint.',defaults:{warmup:10,cooldown:10,tempoMinutes:20,targetPace:''}},
    progressive:{label:'Progressivo · 3 etapas',short:'Progressivo',desc:'Começa em ritmo leve e termina mais rápido, em etapas.',example:'2 km leves + 2 km moderados + 2 km fortes',rpe:'3/10 → 7/10',hint:'Aumente a intensidade progressivamente, sem começar rápido demais.',defaults:{warmup:0,cooldown:0,progressMode:'km',stage1:2,stage2:2,stage3:2,pace1:'',pace2:'',pace3:''}},
    hills:{label:'Subidas · Hill Repeats',short:'Subidas',desc:'Repetições de subida com recuperação controlada.',example:'8 × 100 m de subida',rpe:'7–9/10',hint:'Prefira inclinação moderada e terreno seguro. Recupere bem entre repetições.',defaults:{warmup:12,cooldown:10,repeats:8,hillMode:'distance',hillDistance:100,hillSeconds:30,recoveryValue:2,recoveryActivity:'Descida caminhando'}},
    racepace:{label:'Ritmo de prova · Race Pace',short:'Ritmo de prova',desc:'Pratica um ritmo-alvo para uma distância de competição.',example:'4 km no ritmo-alvo de 10 km',rpe:'Depende da distância da prova',hint:'Defina um ritmo que seja realista para seu condicionamento e objetivo.',defaults:{warmup:10,cooldown:10,distance:4,event:'10 km',targetPace:'5:30'}},
    strides:{label:'Educativos + acelerações · Strides',short:'Educativos',desc:'Trabalho técnico seguido de acelerações curtas e relaxadas.',example:'Educativos + 4 × 80 m',rpe:'Acelerações ágeis, sem sprint máximo',hint:'Priorize postura, coordenação e recuperação completa entre as acelerações.',defaults:{warmup:10,cooldown:5,drillsMinutes:8,repeats:4,strideDistance:80,recoverySeconds:60}}
  };
  const RUN_PARAM_NAMES = ['warmup','cooldown','repeats','workMode','workDistance','workSeconds','recoveryMode','recoveryValue','recoveryActivity','targetPace','fastMinutes','easyMinutes','tempoMinutes','progressMode','stage1','stage2','stage3','pace1','pace2','pace3','hillMode','hillDistance','hillSeconds','event','drillsMinutes','strideDistance','recoverySeconds','achievedRepeats','actualFastPace','rpe'];
  const RUN_TEXT_PARAMS = ['workMode','recoveryMode','recoveryActivity','targetPace','progressMode','pace1','pace2','pace3','hillMode','event','actualFastPace'];
  function defaultRun(kind='easy') {const k=RUN_KINDS[kind]||RUN_KINDS.easy;return {kind:RUN_KINDS[kind]?kind:'easy',distance:k.defaults.distance||0,duration:k.defaults.duration||0,params:{...k.defaults}};}
  function safeRun(r){const kind=RUN_KINDS[r?.kind]?r.kind:'easy',src=r?.params&&typeof r.params==='object'?r.params:{},params={};
    for(const k of RUN_PARAM_NAMES){if(src[k]===undefined||src[k]===null)continue;params[k]=RUN_TEXT_PARAMS.includes(k)?String(src[k]).slice(0,80):num(src[k]);}
    return {kind,distance:num(r?.distance),duration:num(r?.duration),params};}
  function runType(r){return RUN_KINDS[r?.kind]||RUN_KINDS.easy;}
  function runShort(r){const p=r?.params||{},k=r?.kind||'easy',x=(v)=>displayNum(v,1);
    if(k==='intervals')return `${x(p.repeats||6)} × ${p.workMode==='time'?x(p.workSeconds)+' s':x(p.workDistance)+' m'} · pausa ${x(p.recoveryValue)} ${p.recoveryMode==='distance'?'m':'min'}`;
    if(k==='fartlek')return `${x(p.repeats||5)} × (${x(p.fastMinutes)} min forte + ${x(p.easyMinutes)} min leve)`;
    if(k==='tempo')return `${x(p.tempoMinutes)} min ritmo forte`;
    if(k==='progressive')return `${[p.stage1,p.stage2,p.stage3].map(x).join(' + ')} ${p.progressMode==='min'?'min':'km'}`;
    if(k==='hills')return `${x(p.repeats)} × ${p.hillMode==='time'?x(p.hillSeconds)+' s':x(p.hillDistance)+' m'} de subida`;
    if(k==='strides')return `${x(p.repeats)} × ${x(p.strideDistance)} m de aceleração`;
    return [r?.distance?x(r.distance)+' km':'',r?.duration?x(r.duration)+' min':''].filter(Boolean).join(' · ')||'Sem meta principal';}
  function runSteps(r){const p=r?.params||{},k=r?.kind||'easy',steps=[],fmt=n=>displayNum(n,1);const add=(t)=>steps.push(t);const warm=num(p.warmup),cool=num(p.cooldown);
    if(warm)add(`Aquecimento: ${fmt(warm)} min leves`);
    if(k==='intervals')add(`${fmt(p.repeats)} tiros de ${p.workMode==='time'?fmt(p.workSeconds)+' segundos':fmt(p.workDistance)+' metros'} rápidos${p.targetPace?' · ritmo-alvo '+p.targetPace+' min/km':''}`),add(`Entre tiros: ${fmt(p.recoveryValue)} ${p.recoveryMode==='distance'?'m':'min'} de ${p.recoveryActivity||'trote'} (geralmente entre as repetições)`);
    else if(k==='fartlek')add(`${fmt(p.repeats)} ciclos de ${fmt(p.fastMinutes)} min rápidos + ${fmt(p.easyMinutes)} min leves${p.targetPace?' · alvo rápido '+p.targetPace+' min/km':''}`);
    else if(k==='tempo')add(`${fmt(p.tempoMinutes)} min em ritmo firme e sustentável${p.targetPace?' · alvo '+p.targetPace+' min/km':''}`);
    else if(k==='progressive'){const unit=p.progressMode==='min'?'min':'km';for(let i=1;i<=3;i++)add(`Etapa ${i} · ${['leve','moderada','forte'][i-1]}: ${fmt(p['stage'+i])} ${unit}${p['pace'+i]?' · alvo '+p['pace'+i]+' min/km':''}`);}
    else if(k==='hills')add(`${fmt(p.repeats)} subidas de ${p.hillMode==='time'?fmt(p.hillSeconds)+' segundos':fmt(p.hillDistance)+' metros'}`),add(`Recuperação entre subidas: ${fmt(p.recoveryValue)} min · ${p.recoveryActivity||'descida caminhando'}`);
    else if(k==='racepace')add(`${fmt(r.distance)} km ${p.targetPace?'no ritmo-alvo '+p.targetPace+' min/km':'no ritmo-alvo a definir'} para prova de ${p.event||'10 km'}`);
    else if(k==='strides')add(`${fmt(p.drillsMinutes)} min de educativos (elevação de joelho, skipping, coordenação)`),add(`${fmt(p.repeats)} acelerações de ${fmt(p.strideDistance)} m com ${fmt(p.recoverySeconds)} s de recuperação`);
    else add(`${r.distance?fmt(r.distance)+' km':''}${r.distance&&r.duration?' ou ':''}${r.duration?fmt(r.duration)+' min':''} em intensidade ${k==='recovery'?'bem leve':k==='long'?'confortável e constante':'conversável'}`);
    if(cool)add(`Desaquecimento: ${fmt(cool)} min leves`);
    return steps;}
  function runVolume(r){const p=r?.params||{},k=r?.kind||'easy',fmt=n=>displayNum(n,1),v=[];
    if(k==='intervals'&&p.repeats&&p.workMode!=='time'&&p.workDistance)v.push(`${fmt(p.repeats*p.workDistance/1000)} km de tiros, sem aquecimento e recuperação`);
    if(k==='intervals'&&p.repeats&&p.workMode==='time'&&p.recoveryMode==='time')v.push(`${fmt(num(p.warmup)+num(p.cooldown)+p.repeats*num(p.workSeconds)/60+Math.max(0,p.repeats-1)*num(p.recoveryValue))} min estruturados`);
    if(k==='fartlek'&&p.repeats)v.push(`${fmt(num(p.warmup)+p.repeats*(num(p.fastMinutes)+num(p.easyMinutes))+num(p.cooldown))} min estruturados`);
    if(k==='tempo')v.push(`${fmt(num(p.warmup)+num(p.tempoMinutes)+num(p.cooldown))} min estruturados`);
    if(k==='progressive')v.push(`${fmt(num(p.stage1)+num(p.stage2)+num(p.stage3))} ${p.progressMode==='min'?'min':'km'} de etapas`);
    if(k==='racepace'&&r.distance)v.push(`${fmt(r.distance)} km no ritmo de prova`);
    return v.join(' · ');}
  state = { tab:'today', selectedDate:today, month:today.slice(0,7), filter:'all', workouts:readStore(), templates:readTemplates(), planDays:[], theme:readTheme(), modal:null, formType:'strength', repeatDays:[], scrollSave:false };
  applyTheme();
  function safeWork(w){
    if (!w||typeof w!=='object'||typeof w.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)||!['strength','run'].includes(w.type)) return null;
    return {id:String(w.id||uid()),date:w.date,type:w.type,title:String(w.title|| (w.type==='run'?'Corrida':'Musculação')).slice(0,90),note:String(w.note||'').slice(0,2000),status:['done','skipped','replaced'].includes(w.status)?w.status:'planned',
      strength:Array.isArray(w.strength)?w.strength.slice(0,45).map(x=>({name:String(x.name||'').slice(0,80),sets:num(x.sets),reps:String(x.reps||'').slice(0,30),weight:num(x.weight)})):[],
      run:safeRun(w.run),
      result:w.result&&typeof w.result==='object'?{strength:Array.isArray(w.result.strength)?w.result.strength.slice(0,45).map(x=>({name:String(x.name||'').slice(0,80),sets:num(x.sets),reps:String(x.reps||'').slice(0,30),weight:num(x.weight)})):[],run:safeRun(w.result.run),note:String(w.result.note||'').slice(0,2000),completedAt:String(w.result.completedAt||'')}:null,
      createdAt:Number(w.createdAt)||Date.now(),source:String(w.source||'oneoff'),templateId:w.templateId?String(w.templateId):null,replacesId:w.replacesId?String(w.replacesId):null};
  }
  function safeTemplate(p){
    if(!p||typeof p!=='object'||!['run','strength'].includes(p.type)||!/^\d{4}-\d{2}-\d{2}$/.test(p.start||'')||!/^\d{4}-\d{2}-\d{2}$/.test(p.end||'')||p.start>p.end)return null;
    return {id:String(p.id||'t_'+uid()).slice(0,100),type:p.type,title:String(p.title||'Treino').slice(0,90),note:String(p.note||'').slice(0,2000),start:p.start,end:p.end,
      days:Array.isArray(p.days)?[...new Set(p.days.map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<=6))]:[],
      enabled:p.enabled!==false,strength:Array.isArray(p.strength)?p.strength.slice(0,45).map(x=>({name:String(x.name||'').slice(0,80),sets:num(x.sets),reps:String(x.reps||'').slice(0,30),weight:num(x.weight)})):[],
      run:safeRun(p.run),createdAt:Number(p.createdAt)||Date.now()};
  }
  function readTemplates(){try{const a=JSON.parse(localStorage.getItem(PLAN_STORE)||'[]');return Array.isArray(a)?a.map(safeTemplate).filter(Boolean):[];}catch{return [];}}
  function persistTemplates(){try{localStorage.setItem(PLAN_STORE,JSON.stringify(state.templates));window.PulsoSocial?.scheduleSync?.();}catch{toast('Não foi possível salvar os planos. Exporte um backup.');}}
  function virtualSession(t,date){return {id:`p:${t.id}:${date}`,date,type:t.type,title:t.title,note:t.note,status:'planned',strength:t.strength.map(x=>({...x})),run:structuredClone(t.run),result:null,templateId:t.id,source:'template',virtual:true,createdAt:t.createdAt};}
  function getWorkout(id){const local=state.workouts.find(x=>x.id===id);if(local)return local;if(typeof id!=='string'||!id.startsWith('p:'))return null;
    const date=id.slice(-10),tid=id.slice(2,-11),t=state.templates.find(x=>x.id===tid);
    return t&&t.enabled&&date>=t.start&&date<=t.end&&t.days.includes(dayIndex(date))?virtualSession(t,date):null;
  }
  function ensureWorkout(w){if(!w?.virtual)return w;const existing=state.workouts.find(x=>x.templateId===w.templateId&&x.date===w.date);if(existing)return existing;
    const stored={...w,virtual:false,id:uid(),strength:w.strength.map(x=>({...x})),run:structuredClone(w.run)};state.workouts.push(stored);return stored;
  }
  function sessionsOn(date){const actual=state.workouts.filter(w=>w.date===date);
    const plans=state.templates.filter(t=>t.enabled&&t.start<=date&&t.end>=date&&t.days.includes(dayIndex(date))&&!actual.some(w=>w.templateId===t.id)).map(t=>virtualSession(t,date));
    return workSorted([...actual,...plans]);
  }
  function sessionsMonth(month){const out=[];const end=monthEnd(month);for(let n=1;n<=end;n++)out.push(...sessionsOn(`${month}-${String(n).padStart(2,'0')}`));return out;}
  function futureWorkouts(date,max=3){let found=[];for(let i=1;i<=70&&found.length<max;i++)found.push(...sessionsOn(addDays(date,i)).filter(w=>w.status==='planned'));return found.slice(0,max);}
  function visibleStats(ws){return ws.filter(w=>w.status!=='replaced');}
  function readStore(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a.map(safeWork).filter(Boolean):[];}catch{return [];}}
  function persist(){try{localStorage.setItem(STORE,JSON.stringify(state.workouts));window.PulsoSocial?.scheduleSync?.();}catch{toast('Não foi possível salvar neste navegador. Faça um backup.');}}
  function readTheme(){try{return localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';}catch{return 'light';}}
  function applyTheme(){document.documentElement.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#121a16':'#f5f7f3';}
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2500);}
  function setTab(tab){if(tab==='today'){state.selectedDate=today;state.month=today.slice(0,7);}state.tab=tab;state.filter='all';closeModal(false);render();window.scrollTo({top:0,behavior:'smooth'});}
  function navButton(tab, mobile=false){const active=state.tab===tab[0];return `<button type="button" class="${mobile?'':'nav-btn '}${active?'active':''}" data-action="tab" data-tab="${tab[0]}" aria-current="${active?'page':'false'}">${icon(tab[2])}<span>${tab[1]}</span></button>`;}
  function monthButtons(){return `<div class="month-controls"><button class="btn icon-only" data-action="month-prev" aria-label="Mês anterior">${icon('chevronleft')}</button><span class="month-label">${esc(monthName(state.month))}</span><button class="btn icon-only" data-action="month-next" aria-label="Mês seguinte">${icon('chevronright')}</button></div>`;}
  function render(){
    document.getElementById('app').innerHTML=`<div class="shell">
      <aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('pulse')}</span><span class="brand-word">pulso<span style="color:var(--green)">.</span></span></div><div class="side-caption">SEU TREINO</div><nav class="side-nav" aria-label="Navegação principal">${tabs.map(t=>navButton(t)).join('')}</nav>
      <div class="side-bottom"><div class="account-slot account-aside" id="pulso-sidebar-account"></div><div class="side-note"><div class="top">${icon('zap','icon-sm')} Um dia de cada vez.</div><p>Planeje, registre e acompanhe. O resto é consistência.</p></div><div class="side-settings"><button class="btn" data-action="settings" style="width:100%">${icon('settings','icon-sm')} Backup e dados</button></div></div></aside>
      <div class="main-wrap"><header class="topbar"><div class="mobile-brand desktop-hide"><span class="brand-mark">${icon('pulse')}</span>pulso<span style="color:var(--green)">.</span></div><div class="topbar-sub">Planeje menos. Treine mais.</div><div class="top-actions"><div class="account-slot" id="pulso-header-account"></div><button class="btn icon-only" data-action="theme" aria-label="Alternar para tema ${state.theme==='light'?'escuro':'claro'}" title="Alternar tema">${icon(state.theme==='light'?'moon':'sun')}</button><button class="btn icon-only desktop-hide" data-action="settings" aria-label="Backup e ajustes">${icon('settings')}</button><button class="btn primary desktop-only" data-action="open-free" data-date="${today}" >${icon('zap','icon-sm')} Treino livre</button></div></header>
      <main class="content">${state.tab==='today'?renderToday():state.tab==='month'?renderMonth():state.tab==='plans'?renderPlans():state.tab==='social'?'<div id="social-root"></div>':renderType(state.tab)}</main></div>
      <nav class="bottom-nav" aria-label="Navegação principal">${tabs.map(t=>navButton(t,true)).join('')}</nav>
    </div>`;
    window.PulsoSocial?.renderAccountUi?.();
    if(state.tab==='social')window.PulsoSocial?.mount?.();
  }
  function renderToday(){
    const date=state.selectedDate, workouts=sessionsOn(date);
    const thisMonth=visibleStats(sessionsMonth(today.slice(0,7)));
    const done=thisMonth.filter(w=>w.status==='done');

  function exRow(x={},i=0,mode='planned') {return `<div class="exercise-row"><div class="exercise-name"><input name="ex_name" aria-label="Exercício" placeholder="Nome do exercício" maxlength="80" value="${esc(x.name||'')}" /><button type="button" class="remove-ex" data-action="remove-ex" aria-label="Remover exercício">${icon('x','icon-sm')}</button></div><div class="exercise-fields"><label>Séries<input name="ex_sets" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="3" value="${x.sets||''}" /></label><label>Repetições<input name="ex_reps" type="text" maxlength="30" placeholder="10–12" value="${esc(x.reps||'')}" /></label><label>Peso (kg)<input name="ex_weight" type="number" min="0" max="2000" step="0.5" inputmode="decimal" placeholder="20" value="${x.weight||''}" /></label></div></div>`;}
  function runNumber(name,label,value='',placeholder='',step='1',hint='') {return `<div class="field"><label for="rf-${name}">${label}</label><input id="rf-${name}" name="${name}" type="number" inputmode="decimal" min="0" step="${step}" placeholder="${placeholder}" value="${value!==''&&value!==null&&value!==undefined?esc(value):''}" />${hint?`<span class="hint">${hint}</span>`:''}</div>`;}
  function runText(name,label,value='',placeholder='5:30'){return `<div class="field"><label for="rf-${name}">${label}</label><input id="rf-${name}" type="text" inputmode="numeric" name="${name}" maxlength="16" value="${esc(value)}" placeholder="${placeholder}" /></div>`;}
  function runSelect(name,label,options,value){return `<div class="field"><label for="rf-${name}">${label}</label><select id="rf-${name}" name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;}
  function runPreviewHTML(r){const meta=runType(r),steps=runSteps(r),volume=runVolume(r);return `<div class="run-preview-title">Como será o treino</div><div class="run-preview-items">${steps.map(t=>`<div class="run-preview-item"><i class="preview-dot"></i><span>${esc(t)}</span></div>`).join('')}</div><div class="run-preview-meta">${volume?esc(volume)+' · ':''}Esforço sugerido: ${esc(meta.rpe)}</div>`;}
  function runFields(input){const raw=safeRun(input||defaultRun('easy')),kind=raw.kind,meta=runType(raw),d=defaultRun(kind),r={...d,...raw,params:{...d.params,...raw.params}},v=r.params;
    const grid=(...items)=>`<div class="field-grid">${items.join('')}</div>`;

    const sel=(name,label,opts)=>runSelect('run_'+name,label,opts,v[name]);
    const warm=()=>grid(n('warmup','Aquecimento (min)','10'),n('cooldown','Desaquecimento (min)','10'));
    const main=grid(runNumber('distance','Distância-alvo (km)',r.distance||'','Ex.: 5','0.1'),runNumber('duration','Tempo-alvo (min)',r.duration||'','Ex.: 30','0.5'));
    let content='';
    if(['easy','recovery','long'].includes(kind))content=`<div class="run-panel-heading"><span class="step-num">1</span> Meta principal</div>${main}<p class="run-instruction">Pode preencher distância, tempo ou ambos. Não é obrigatório ter uma meta de ritmo.</p>`;
    else if(kind==='intervals')content=`<div class="run-panel-heading"><span class="step-num">1</span> Estrutura dos tiros</div>${grid(n('repeats','Quantidade de tiros','6'),sel('workMode','Cada tiro por',[['distance','Distância'],['time','Tempo']]))}${grid(v.workMode==='time'?n('workSeconds','Duração de cada tiro (seg)','60'):n('workDistance','Distância de cada tiro (m)','400'),t('targetPace','Ritmo-alvo dos tiros (min/km)'))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Recuperação entre tiros</div>${grid(sel('recoveryMode','Recuperação por',[['time','Tempo'],['distance','Distância']]),n('recoveryValue',v.recoveryMode==='distance'?'Distância da pausa (m)':'Tempo da pausa (min)','2','0.5'))}${sel('recoveryActivity','Como recuperar',[['Trote','Trote leve'],['Caminhada','Caminhada'],['Parado','Parado']])}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">3</span> Antes e depois</div>${warm()}`;
    else if(kind==='fartlek')content=`<div class="run-panel-heading"><span class="step-num">1</span> Blocos de velocidade</div>${grid(n('repeats','Número de ciclos','5'),n('fastMinutes','Parte rápida (min)','2','0.5'))}${grid(n('easyMinutes','Parte leve (min)','3','0.5'),t('targetPace','Ritmo da parte rápida (opcional)'))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Aquecimento e final</div>${warm()}`;
    else if(kind==='tempo')content=`<div class="run-panel-heading"><span class="step-num">1</span> Bloco em limiar</div>${grid(n('tempoMinutes','Tempo forte controlado (min)','20','0.5'),t('targetPace','Ritmo-alvo (opcional)'))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Aquecimento e final</div>${warm()}`;
    else if(kind==='progressive')content=`<div class="run-panel-heading"><span class="step-num">1</span> Defina as três etapas</div>${sel('progressMode','Planejar etapas por',[['km','Distância (km)'],['min','Tempo (min)']])}${[['stage1','pace1','1 · Leve'],['stage2','pace2','2 · Moderado'],['stage3','pace3','3 · Forte']].map(([key,pace,label])=>grid(n(key,label+(v.progressMode==='min'?' (min)':' (km)'),'2','0.1'),t(pace,'Ritmo-alvo (min/km)'))).join('')}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Extras (se desejar)</div>${warm()}`;
    else if(kind==='hills')content=`<div class="run-panel-heading"><span class="step-num">1</span> Repetições em subida</div>${grid(n('repeats','Número de subidas','8'),sel('hillMode','Cada subida por',[['distance','Distância'],['time','Tempo']]))}${v.hillMode==='time'?n('hillSeconds','Tempo em subida (seg)','30'):n('hillDistance','Distância da subida (m)','100')}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Recuperação</div>${grid(n('recoveryValue','Tempo entre subidas (min)','2','0.5'),sel('recoveryActivity','Como recuperar',[['Descida caminhando','Descer caminhando'],['Descida trotando','Descer trotando'],['Pausa parada','Pausa parada']]))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">3</span> Antes e depois</div>${warm()}`;
    else if(kind==='racepace')content=`<div class="run-panel-heading"><span class="step-num">1</span> Ritmo da competição</div>${sel('event','Distância da prova',[['5 km','5 km'],['10 km','10 km'],['21,1 km','Meia maratona'],['42,2 km','Maratona'],['Outra','Outra']])}${grid(runNumber('distance','Km no ritmo-alvo',r.distance||'','4','0.1'),t('targetPace','Ritmo-alvo (min/km)'))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Aquecimento e final</div>${warm()}`;
    else if(kind==='strides')content=`<div class="run-panel-heading"><span class="step-num">1</span> Técnica + acelerações</div>${grid(n('drillsMinutes','Educativos (min)','8'),n('repeats','Número de acelerações','4'))}${grid(n('strideDistance','Distância por aceleração (m)','80'),n('recoverySeconds','Recuperação (seg)','60'))}<hr class="run-panel-divider"><div class="run-panel-heading"><span class="step-num">2</span> Antes e depois</div>${warm()}`;
    return `<div class="run-builder"><div class="run-kind-head"><span class="run-kind-icon">${icon('run')}</span><span><strong>Tipo de corrida</strong><span>Escolha um método e configure o treino</span></span></div>
      <div class="field" style="margin-bottom:0"><label for="run-kind">Modalidade</label><select name="run_kind" id="run-kind">${Object.entries(RUN_KINDS).map(([key,x])=>`<option value="${key}" ${kind===key?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
      <div class="run-guidance"><strong>${esc(meta.short)} · ${esc(meta.example)}</strong><div>${esc(meta.desc)}</div></div>
      <section class="run-type-panel" aria-label="Parâmetros de ${esc(meta.short)}">${content}<div class="run-guidance" style="margin-top:6px;background:var(--surface)"><strong>Orientação</strong><div>${esc(meta.hint)}</div></div></section>
      <div class="run-preview" aria-live="polite" data-run-preview>${runPreviewHTML(r)}</div></div>`;}
  function workoutFields(type,w){if(type==='run')return runFields(w?.run);
  return `<div class="form-subhead"><h3>Exercícios</h3><button type="button" class="subtle-link" data-action="add-ex">${icon('plus','icon-sm')} Adicionar</button></div><div id="exercises">${(w?.strength?.length?w.strength:[{name:'',sets:3,reps:'10',weight:0}]).map((x,i)=>exRow(x,i)).join('')}</div><div class="hint" style="margin:0 0 17px">Preencha apenas os exercícios que desejar. As cargas são opcionais.</div>`;}
  function openWorkoutForm(id=null, options={}){
    const w=getWorkout(id)||null;
    const type=w?.type||options.type||state.formType||'strength';state.formType=type;
    const date=w?.date||options.date||state.selectedDate||today;
    state.modal={kind:'workout-form',id:w?.id||null,date};
    state.repeatDays=[dayIndex(date)];
    const body=`<form id="workout-form"><div class="type-switch"><button type="button" class="${type==='strength'?'active':''}" data-action="form-type" data-type="strength">${icon('dumbbell')} Musculação</button><button type="button" class="${type==='run'?'active':''}" data-action="form-type" data-type="run">${icon('run')} Corrida</button></div>
      <div class="field-grid"><div class="field"><label for="workout-date">Dia do treino</label><input id="workout-date" name="date" type="date" required value="${esc(date)}" /></div><div class="field"><label for="workout-title">Nome do treino</label><input id="workout-title" name="title" maxlength="90" required placeholder="${type==='run'?'Corrida leve':'Treino A'}" value="${esc(w?.title|| (type==='strength'?'Treino de força':'Corrida'))}" /></div></div>
      <div id="type-fields">${workoutFields(type,w)}</div>
      <div class="field"><label for="workout-note">Observações (opcional)</label><textarea name="note" id="workout-note" rows="2" placeholder="Ex.: treino de pernas, corrida confortável, alongamento...">${esc(w?.note||'')}</textarea></div>
      ${w?'':`<div class="repeat-box"><label class="repeat-label"><input id="repeat-check" type="checkbox" name="repeat" /> Repetir semanalmente neste mês</label><p>Cria automaticamente um treino para cada dia da semana selecionado até o fim do mês.</p><div id="repeat-area" hidden><div class="repeat-days">${weekdays.map((d,i)=>`<button type="button" data-action="repeat-day" data-day="${i}" class="weekday-toggle ${state.repeatDays.includes(i)?'active':''}">${d}</button>`).join('')}</div></div></div>`}
      </form>`;
    modalBase(w?'Editar planejamento':'Planejar sessão avulsa',w?'Altere esta sessão sem afetar as demais.':'Uma sessão pontual. Para períodos completos, use Meus planos.',body,`<button class="btn" data-action="close">Cancelar</button><button class="btn primary" data-action="save-workout">${icon('check','icon-sm')} ${w?'Salvar alterações':'Salvar treino'}</button>`);

  function openFreeForm(options={}){
    const date=options.date||state.selectedDate||today,origin=options.replaceId?getWorkout(options.replaceId):null;
    const type=options.type||origin?.type||'strength';state.formType=type;state.modal={kind:'free-form',date,replaceId:options.replaceId||''};
    const planned=sessionsOn(date).filter(w=>w.status==='planned');
    const body=`<form id="free-form"><div class="free-intro">${icon('zap')}<span><strong>Você escolhe o treino.</strong><small>Registre o que realmente fez, mesmo que não estivesse no plano.</small></span></div>
      <div class="type-switch"><button type="button" class="${type==='strength'?'active':''}" data-action="free-type" data-type="strength">${icon('dumbbell')} Musculação</button><button type="button" class="${type==='run'?'active':''}" data-action="free-type" data-type="run">${icon('run')} Corrida</button></div>
      <div class="field-grid"><div class="field"><label for="free-date">Dia realizado</label><input type="date" name="date" id="free-date" required value="${esc(date)}" /></div><div class="field"><label for="free-title">Nome do treino</label><input name="title" id="free-title" maxlength="90" required value="${esc(options.title||'Treino livre')}" /></div></div>

      <div class="field"><label for="free-replaces">Esse treino substituiu algum planejado?</label><select name="replaces" id="free-replaces"><option value="">Não, é um treino extra / independente</option>${planned.map(w=>`<option value="${esc(w.id)}" ${w.id===options.replaceId?'selected':''}>Sim, substituiu: ${esc(w.title)}</option>`).join('')}</select><span class="hint">Se substituir, o treino programado ficará marcado como “Substituído”, sem alterar os outros dias.</span></div>

  function updateFreeOptions(date){const select=document.getElementById('free-replaces');if(!select)return;select.innerHTML=`<option value="">Não, é um treino extra / independente</option>${sessionsOn(date).filter(w=>w.status==='planned').map(w=>`<option value="${esc(w.id)}">Sim, substituiu: ${esc(w.title)}</option>`).join('')}`;}
  function saveFree(){const form=document.getElementById('free-form');if(!form||!form.reportValidity())return;
    const date=form.elements.date.value,type=state.formType,title=form.elements.title.value.trim(),replacementId=form.elements.replaces.value;
    if(!title)return toast('Informe um nome para o treino.');
    const original=replacementId?getWorkout(replacementId):null;
    if(replacementId&&(!original||original.date!==date||original.status!=='planned'))return toast('O treino que você deseja substituir não está disponível.');
    const strength=type==='strength'?collectExercises(form):[],run=type==='run'?getRun(form):{distance:0,duration:0},note=form.elements.note.value.trim();
    const id=uid(),real={id,date,type,title,note,status:'done',strength:strength.map(x=>({...x})),run:{...run},result:{strength:strength.map(x=>({...x})),run:{...run},note,completedAt:new Date().toISOString()},source:'free',createdAt:Date.now(),replacesId:original?.id||null};
    if(original){const saved=ensureWorkout(original);saved.status='replaced';saved.result=null;real.replacesId=saved.id;}
    state.workouts.push(real);persist();closeModal();state.tab='today';state.selectedDate=date;state.month=date.slice(0,7);render();toast(original?'Treino livre registrado. O previsto foi substituído.':'Treino livre registrado!');
  }

  function collectExercises(root){return [...root.querySelectorAll('.exercise-row')].map(row=>({name:row.querySelector('[name="ex_name"]').value.trim(),sets:num(row.querySelector('[name="ex_sets"]').value),reps:row.querySelector('[name="ex_reps"]').value.trim(),weight:num(row.querySelector('[name="ex_weight"]').value)})).filter(x=>x.name);}
  function getRun(root){const kind=root.querySelector('[name="run_kind"]')?.value||'easy',defaults=defaultRun(kind),params={...defaults.params};
    for(const el of root.querySelectorAll('[name^="run_"]')){if(el.name==='run_kind')continue;const key=el.name.slice(4);if(!RUN_PARAM_NAMES.includes(key))continue;params[key]=RUN_TEXT_PARAMS.includes(key)?el.value.trim():num(el.value);}
    return {kind,distance:num(root.querySelector('[name="distance"]')?.value),duration:num(root.querySelector('[name="duration"]')?.value),params};}
  function getRunResult(root,planned){const r={kind:planned.kind||'easy',distance:num(root.querySelector('[name="distance"]')?.value),duration:num(root.querySelector('[name="duration"]')?.value),params:{}};
    for(const key of ['achievedRepeats','actualFastPace','rpe']){const val=root.querySelector(`[name="actual_${key}"]`)?.value;r.params[key]=key==='actualFastPace'?String(val||'').slice(0,16):num(val);}
    return r;}
  function refreshRunBuilder(changeKind=false){const form=document.querySelector('#plan-form, #workout-form, #free-form');if(!form)return;const builder=form.querySelector('.run-builder');if(!builder)return;
    const selected=form.querySelector('[name="run_kind"]')?.value||'easy';const prev=getRun(form);const r=changeKind?defaultRun(selected):{...prev,kind:selected};
    builder.outerHTML=runFields(r);
    if(changeKind){const name=form.querySelector('[name="title"]');if(name&&(!name.value.trim()||['Corrida','Corrida leve','Treino livre'].includes(name.value.trim())||Object.values(RUN_KINDS).some(k=>name.value.trim()===k.label.split(' · ')[0])))name.value=RUN_KINDS[selected].label.split(' · ')[0];}
  }
  function refreshRunPreview(){const form=document.querySelector('#plan-form, #workout-form, #free-form');const preview=form?.querySelector('[data-run-preview]');if(preview)preview.innerHTML=runPreviewHTML(getRun(form));}
  function saveWorkout(){
    const form=document.getElementById('workout-form');if(!form||!form.reportValidity())return;
    const date=form.elements.date.value,title=form.elements.title.value.trim(),type=state.formType,old=getWorkout(state.modal?.id);
    if(!title){toast('Digite um nome para o treino.');return;}
    const strength=type==='strength'?collectExercises(form):[],run=type==='run'?getRun(form):{distance:0,duration:0};
    const data={date,title,type,note:form.elements.note.value.trim(),strength,run};
    if(old){const saved=ensureWorkout(old);Object.assign(saved,data);persist();closeModal();render();toast('Sessão atualizada (sem alterar os outros dias).');return;}
    const repeat=form.querySelector('[name="repeat"]')?.checked;
    const dates=[];
    if(repeat){let d=parseDate(date),end=new Date(d.getFullYear(),d.getMonth()+1,0),days=state.repeatDays.length?state.repeatDays:[dayIndex(date)];while(d<=end){let s=localDate(d);if(days.includes(dayIndex(s)))dates.push(s);d.setDate(d.getDate()+1);}}
    else dates.push(date);
    // Prevent double-creation when editing the routine: new sessions are always independent.
    const created=dates.map(dt=>({...data,id:uid(),date:dt,status:'planned',result:null,createdAt:Date.now()}));
    state.workouts.push(...created);persist();closeModal();state.month=date.slice(0,7);state.selectedDate=date;render();toast(`${created.length} ${created.length===1?'treino planejado':'treinos planejados'}!`);
  }
  function cloneResult(w){return {strength:w.strength.map(x=>({...x})),run:{kind:w.run.kind||'easy',distance:w.run.distance,duration:w.run.duration,params:{}},note:'',completedAt:new Date().toISOString()};}
  function quickDone(id){const original=getWorkout(id);if(!original||original.status==='replaced')return;const w=ensureWorkout(original);if(w.status==='done'){w.status='planned';w.result=null;toast('Treino desmarcado.');}else{w.status='done';w.result=w.result||cloneResult(w);w.result.completedAt=new Date().toISOString();toast('Treino concluído! Boa!');}persist();render();if(state.modal?.kind==='details'&&state.modal.id===id)openDetails(w.id);}
  function detailList(w,real=false){
    const info=real?w.result:w;
    if(!info)return `<p class="micro">Sem registro ainda.</p>`;
    if(w.type==='run'){
      const v=info.run||{},pace=v.distance&&v.duration?Number(v.duration)/Number(v.distance):0;const paceSeconds=Math.round(pace*60);
      const isReal=real, meta=runType(w.run),params=v.params||{};
      return `<div class="detail-list"><div class="detail-line"><strong>Tipo de corrida</strong><span>${esc(meta.label)}</span></div>
      ${!isReal?`<div class="run-preview" style="margin:0"><div class="run-preview-title">Sequência do treino</div><div class="run-preview-items">${runSteps(v).map(step=>`<div class="run-preview-item"><i class="preview-dot"></i><span>${esc(step)}</span></div>`).join('')}</div><div class="run-preview-meta">Esforço sugerido: ${esc(meta.rpe)}${runVolume(v)?' · '+esc(runVolume(v)):''}</div></div>`:''}
      <div class="detail-line"><strong>${isReal?'Distância realizada':'Distância-alvo total (se informada)'}</strong><span>${v.distance?displayNum(v.distance)+' km':'Não informada'}</span></div>
      <div class="detail-line"><strong>${isReal?'Tempo realizado':'Tempo-alvo total (se informado)'}</strong><span>${v.duration?displayNum(v.duration,1)+' min':'Não informado'}</span></div>
      ${pace?`<div class="detail-line"><strong>Ritmo médio ${isReal?'realizado':'estimado'}</strong><span>${Math.floor(paceSeconds/60)}:${String(paceSeconds%60).padStart(2,'0')} min/km</span></div>`:''}
      ${isReal&&params.achievedRepeats?`<div class="detail-line"><strong>Repetições realizadas</strong><span>${displayNum(params.achievedRepeats,0)}</span></div>`:''}
      ${isReal&&params.actualFastPace?`<div class="detail-line"><strong>Ritmo dos blocos rápidos</strong><span>${esc(params.actualFastPace)} min/km</span></div>`:''}
      ${isReal&&params.rpe?`<div class="detail-line"><strong>Esforço percebido</strong><span>${displayNum(params.rpe,0)} / 10</span></div>`:''}</div>`;
    }
    const ex=info.strength||[];return ex.length?`<div class="detail-list">${ex.map(x=>`<div class="detail-line"><strong>${esc(x.name)}</strong><span>${x.sets?x.sets+' séries':''}${x.reps?' · '+esc(x.reps)+' reps':''}${x.weight?' · '+displayNum(x.weight)+' kg':''}</span></div>`).join('')}</div>`:`<p class="micro">Nenhum exercício registrado.</p>`;
  }
  function openDetails(id){const w=getWorkout(id);if(!w)return;state.modal={kind:'details',id};

    modalBase(esc(w.title),subtitle,body,footer);
  }
  function openResult(id){const w=getWorkout(id);if(!w)return;state.modal={kind:'result',id};const r=w.result||cloneResult(w);
    const contents=`<form id="result-form">${w.type==='run'?`<div class="run-guidance" style="margin-bottom:16px"><strong>${esc(runType(w.run).short)}</strong><div>${esc(runShort(w.run))} · Confira o passo a passo em “O que foi planejado”.</div></div><div class="field-grid"><div class="field"><label for="res-distance">Distância realizada (km)</label><input id="res-distance" type="number" step="0.01" min="0" name="distance" inputmode="decimal" value="${r.run.distance||''}" placeholder="5,0" /></div><div class="field"><label for="res-duration">Tempo realizado (min)</label><input id="res-duration" type="number" min="0" step="0.1" name="duration" inputmode="decimal" value="${r.run.duration||''}" placeholder="32" /></div></div><p class="run-result-tip">Informe a distância e o tempo totais reais para calcular o ritmo médio (incluindo recuperações).</p>${['intervals','fartlek','hills','strides'].includes(w.run.kind)?`<div class="field-grid">${runNumber('actual_achievedRepeats','Repetições feitas',r.run.params?.achievedRepeats||'','Ex.: 6')}${runText('actual_actualFastPace','Ritmo médio dos trechos fortes',r.run.params?.actualFastPace||'','Ex.: 4:50')}</div>`:''}<div class="field">${runNumber('actual_rpe','Esforço percebido (0 a 10)',r.run.params?.rpe||'','Ex.: 6')}</div>`:
    `<div class="form-subhead"><h3>Exercícios realizados</h3><button type="button" class="subtle-link" data-action="add-ex">${icon('plus','icon-sm')} Adicionar</button></div><div id="exercises">${(r.strength.length?r.strength:[{name:'',sets:3,reps:'10',weight:0}]).map((x,i)=>exRow(x,i,'real')).join('')}</div>`}
    <div class="field"><label for="res-note">Como foi? (opcional)</label><textarea id="res-note" name="note" placeholder="Ex.: aumentei 2 kg no supino, ritmo confortável, sem dores...">${esc(r.note)}</textarea></div></form>`;
    modalBase('Registrar o que fiz',esc(w.title)+' · '+esc(shortDate(w.date)),contents,`<button class="btn" data-action="details" data-id="${esc(id)}">Voltar</button><button class="btn primary" data-action="save-result">${icon('check','icon-sm')} Salvar e concluir</button>`);
  }
  function saveResult(){const original=getWorkout(state.modal?.id),form=document.getElementById('result-form');if(!original||!form)return;const w=ensureWorkout(original);
    if(!form.reportValidity())return;w.result={strength:w.type==='strength'?collectExercises(form):[],run:w.type==='run'?getRunResult(form,w.run):{distance:0,duration:0},note:form.elements.note.value.trim(),completedAt:new Date().toISOString()};w.status='done';persist();render();openDetails(w.id);toast('Resultado registrado!');}
  function openDelete(id){const w=getWorkout(id);if(!w)return;state.modal={kind:'delete',id};modalBase(w.templateId?'Retirar este dia do plano?':'Excluir treino?','Esta ação não pode ser desfeita.',`<p class="confirm-text">${w.templateId?'Apenas esta sessão será marcada como não realizada, sem afetar os demais dias.':'Deseja excluir'} <strong>${esc(w.title)}</strong> de ${esc(shortDate(w.date))}?</p>`,`<button class="btn" data-action="details" data-id="${esc(id)}">Cancelar</button><button class="btn danger" data-action="delete" data-id="${esc(id)}">Excluir treino</button>`);}
  function openSettings(){state.modal={kind:'settings'};modalBase('Seus dados','Controle local e backup',`<div class="detail-callout">${icon('info')}<div><strong>Seus treinos ficam neste navegador.</strong><small>O GitHub hospeda o site, mas não sincroniza os registros entre celulares e computadores.</small></div></div><div class="tool-grid"><button class="tool-card" data-action="export">${icon('download')}<strong>Exportar backup</strong><p>Salve seus treinos em um arquivo JSON.</p></button><button class="tool-card" data-action="import">${icon('upload')}<strong>Importar backup</strong><p>Restaure os dados em outro aparelho.</p></button></div><div class="tool-grid" style="margin-top:0"><button class="tool-card" data-action="theme">${icon(state.theme==='light'?'moon':'sun')}<strong>${state.theme==='light'?'Ativar modo escuro':'Ativar modo claro'}</strong><p>Alterne o visual quando quiser.</p></button><button class="tool-card" data-action="reset-ask">${icon('trash')}<strong>Apagar tudo</strong><p>Exclua planos e registros deste navegador.</p></button></div><p class="guide-note">Dica: faça um backup periodicamente, especialmente antes de limpar o navegador ou trocar de celular.</p>`, `<button class="btn primary" data-action="close">Entendi</button>`);}
  function exportBackup(){const data={app:'pulso',version:3,exportedAt:new Date().toISOString(),workouts:state.workouts,templates:state.templates};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pulso-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exportado.');}
  function openReset(){state.modal={kind:'reset'};modalBase('Apagar planos e treinos?','Confirmação necessária',`<p class="confirm-text">Todos os planos, treinos e resultados salvos neste navegador serão excluídos. Exporte um backup antes, se quiser guardá-los.</p>`,`<button class="btn" data-action="settings">Cancelar</button><button class="btn danger" data-action="reset">Apagar tudo</button>`);}
  function seedDemo(){if(state.workouts.length){toast('Use “Novo treino” para acrescentar sessões.');return;}
    const first=addDays(today,0),next=addDays(today,1),third=addDays(today,2),fourth=addDays(today,4);
    state.workouts=[
      {id:uid(),date:first,type:'strength',title:'Treino A · Superior',note:'Aqueça por 5 minutos antes de começar.',status:'planned',strength:[{name:'Supino reto',sets:3,reps:'10',weight:20},{name:'Remada baixa',sets:3,reps:'12',weight:25},{name:'Desenvolvimento',sets:3,reps:'10',weight:10}],run:{distance:0,duration:0},result:null,createdAt:Date.now()},
      {id:uid(),date:next,type:'run',title:'Corrida leve',note:'Ritmo confortável, sem buscar velocidade.',status:'planned',strength:[],run:{distance:5,duration:35},result:null,createdAt:Date.now()+1},

      {id:uid(),date:fourth,type:'run',title:'Corrida longa',note:'Controle de ritmo do início ao fim.',status:'planned',strength:[],run:{distance:8,duration:60},result:null,createdAt:Date.now()+3}
    ];persist();render();toast('4 treinos de exemplo adicionados. Pode editá-los!');}
  function doAction(btn){const a=btn.dataset.action,id=btn.dataset.id;
    switch(a){
      case 'tab':setTab(btn.dataset.tab);break;
      case 'month-tab':setTab('month');break;
      case 'plans-tab':setTab('plans');break;

      case 'preset-plan':openPlanForm(null,{preset:btn.dataset.preset});break;
      case 'edit-plan':{const p=state.templates.find(x=>x.id===id);if(p)openPlanForm(id);else toast('Este plano não está mais disponível.');break;}
      case 'save-plan':savePlan();break;
      case 'plan-day':{const n=Number(btn.dataset.day);state.planDays=state.planDays.includes(n)?state.planDays.filter(x=>x!==n):[...state.planDays,n];btn.classList.toggle('active',state.planDays.includes(n));btn.setAttribute('aria-pressed',String(state.planDays.includes(n)));break;}
      case 'toggle-plan':{const p=state.templates.find(x=>x.id===id);if(!p)break;p.enabled=!p.enabled;persistTemplates();render();toast(p.enabled?'Plano ativado.':'Plano pausado.');break;}
      case 'delete-plan-ask':openPlanDelete(id);break;
      case 'delete-plan':state.templates=state.templates.filter(x=>x.id!==id);persistTemplates();closeModal();render();toast('Plano excluído. Registros realizados preservados.');break;
      case 'open-free':openFreeForm({date:btn.dataset.date||state.selectedDate||today,type:btn.dataset.type||undefined,replaceId:btn.dataset.replace||undefined});break;
      case 'save-free':saveFree();break;
      case 'go-today':state.selectedDate=today;state.month=today.slice(0,7);render();break;
      case 'new':openWorkoutForm(null,{date:btn.dataset.date||(['today','month'].includes(state.tab)?state.selectedDate:(state.month===today.slice(0,7)?today:state.month+'-01')),type:btn.dataset.type|| (state.tab==='strength'?'strength':state.tab==='run'?'run':'strength')});break;
      case 'select-day':state.selectedDate=btn.dataset.date;render();break;
      case 'select-month-day':state.selectedDate=btn.dataset.date;render();break;
      case 'month-prev':case 'month-next':state.month=modMonth(state.month,a==='month-next'?1:-1);state.selectedDate=state.month+'-01';render();break;
      case 'filter':state.filter=btn.dataset.filter;render();break;
      case 'theme':state.theme=state.theme==='light'?'dark':'light';applyTheme();try{localStorage.setItem(THEME_KEY,state.theme);}catch{};render();if(state.modal?.kind==='settings')openSettings();break;
      case 'settings':openSettings();break;
      case 'close':closeModal();break;
      case 'overlay':closeModal();break;
      case 'details':openDetails(id);break;
      case 'quick-done':quickDone(id);break;
      case 'restore-plan':{const w=getWorkout(id);if(w&&!w.virtual){w.status='planned';w.result=null;persist();render();openDetails(w.id);toast('Treino planejado restaurado.');}break;}
      case 'edit':openWorkoutForm(id);break;
      case 'result':openResult(id);break;
      case 'save-result':saveResult();break;
      case 'save-workout':saveWorkout();break;
      case 'delete-ask':openDelete(id);break;
      case 'delete':{const w=getWorkout(id);if(w?.templateId){const a=ensureWorkout(w);a.status='skipped';a.result=null;toast('Sessão retirada deste dia. O plano continua.');}else{if(w?.source==='free'&&w.replacesId){const prev=state.workouts.find(x=>x.id===w.replacesId);if(prev&&prev.status==='replaced'){prev.status='planned';prev.result=null;}}state.workouts=state.workouts.filter(x=>x.id!==id);toast('Treino excluído.');}persist();closeModal();render();break;}

      case 'form-type':case 'free-type':case 'plan-type':{
        if(state.formType===btn.dataset.type)return;

      case 'demo':seedDemo();break;
      case 'export':exportBackup();break;
      case 'import':document.getElementById('backup-file').click();break;
      case 'reset-ask':openReset();break;
      case 'reset':state.workouts=[];state.templates=[];persist();persistTemplates();closeModal();render();toast('Planos e treinos apagados deste navegador.');break;
    }
  }
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='overlay'&&e.target!==btn)return;doAction(btn);});

      const cleaned=arr.map(safeWork);if(cleaned.some(w=>!w))throw Error('Arquivo com registros inválidos.');
      const rawPlans=Array.isArray(data)?[]:(data.templates||[]);if(!Array.isArray(rawPlans)||rawPlans.length>250)throw Error('Planos inválidos no backup.');const cleanedPlans=rawPlans.map(safeTemplate);if(cleanedPlans.some(p=>!p))throw Error('Backup contém planos inválidos.');
      const replace=confirm(`Importar ${cleaned.length} treinos e ${cleanedPlans.length} planos?\n\nOK = substituir os dados atuais.\nCancelar = manter os dados sem importar.`);
      if(!replace)return;
      state.workouts=cleaned;state.templates=cleanedPlans;persist();persistTemplates();closeModal();render();toast('Backup restaurado: treinos e planos.');
    }catch(err){toast(err.message||'Não foi possível importar este arquivo.');}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();});
  // API local utilizada somente pela integração opcional com Firebase.
  // Todos os usuários têm armazenamento separado no mesmo navegador.
  window.PulsoLocal = {
    get(){return {workouts:structuredClone(state.workouts),templates:structuredClone(state.templates)};},
    getGuest(){try{return {workouts:JSON.parse(localStorage.getItem('pulso_treinos_v1')||'[]'),templates:JSON.parse(localStorage.getItem('pulso_planos_v2')||'[]')};}catch{return {workouts:[],templates:[]};}},
    switchAccount(uid){STORE=uid?'pulso_treinos_v1_user_'+uid:'pulso_treinos_v1';PLAN_STORE=uid?'pulso_planos_v2_user_'+uid:'pulso_planos_v2';state.workouts=readStore();state.templates=readTemplates();state.tab=uid?'today':state.tab;render();},
    setAccount(data){state.workouts=(data.workouts||[]).map(safeWork).filter(Boolean);state.templates=(data.templates||[]).map(safeTemplate).filter(Boolean);persist();persistTemplates();render();},
    refresh(){render();},
    navigate(tab){if(tabs.some(t=>t[0]===tab))setTab(tab);},
    notify:toast
  };
  render();
})();
